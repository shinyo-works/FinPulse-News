<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="帯広エリアの金融機関の住宅ローン金利を、種別ごとに過去まで遡れる金利履歴ビューアー">
  <title>金利履歴ビューアー｜FinPulse</title>
  <style>
    :root {
      --navy-950: #0b1f33;
      --navy-900: #102a43;
      --navy-800: #173e5e;
      --teal-700: #0d6e6e;
      --teal-600: #138484;
      --teal-100: #dff3f1;
      --up: #c0392b;
      --up-bg: #fdecea;
      --down: #0d6e6e;
      --down-bg: #e3f4f1;
      --ink: #172b3a;
      --muted: #647684;
      --line: #d9e2e8;
      --paper: #ffffff;
      --canvas: #f4f7f8;
      --shadow: 0 10px 30px rgba(11, 31, 51, 0.08);
      --radius: 14px;
    }

    * { box-sizing: border-box; }
    html { color-scheme: light; }
    /* ページ全体は固定し、補足情報と表を同じ枠の中でスクロールさせる。 */
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      color: var(--ink);
      background: var(--canvas);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif;
      line-height: 1.4;
    }
    button, input { font: inherit; }
    button { color: inherit; }

    /* index.html のタブ内（iframe）に表示するため、見出しは控えめの高さにする */
    .site-header {
      flex: none;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 8px clamp(12px, 3vw, 36px);
      color: #eef7fa;
      background:
        radial-gradient(circle at 12% 0%, rgba(32, 144, 139, 0.32), transparent 34%),
        var(--navy-950);
    }
    .brand-mark {
      display: inline-flex;
      flex: none;
      align-items: center;
      gap: 10px;
      font-size: 1.02rem;
      font-weight: 750;
      letter-spacing: 0.02em;
    }
    .pulse-dot {
      width: 11px; height: 11px; border-radius: 50%;
      background: #55d6c9; box-shadow: 0 0 0 5px rgba(85, 214, 201, 0.15);
    }
    /* 説明文は見出しの右側で、従来の文字サイズのまま1行に収める。 */
    .site-header p {
      flex: 1 1 auto;
      min-width: 0;
      margin: 0;
      color: #a9c0ce;
      font-size: 0.8rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .controls {
      flex: none;
      z-index: 20;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      padding: 5px clamp(12px, 3vw, 36px);
      background: rgba(244, 247, 248, 0.95);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(10px);
    }
    .search-wrap { position: relative; flex: 0 1 190px; min-width: 132px; }
    .search-icon {
      position: absolute; left: 11px; top: 50%;
      color: var(--muted); transform: translateY(-50%); pointer-events: none;
    }
    #searchInput {
      width: 100%;
      height: 30px;
      padding: 3px 10px 3px 31px;
      color: var(--ink); background: var(--paper);
      border: 1px solid var(--line); border-radius: 9px; outline: none;
      font-size: 0.84rem;
    }
    #searchInput:focus { border-color: var(--teal-600); box-shadow: 0 0 0 3px rgba(19,132,132,0.13); }

    .type-chips { display: flex; flex-wrap: wrap; gap: 4px; }
    .chip {
      padding: 4px 10px;
      color: var(--navy-800); background: var(--paper);
      border: 1px solid var(--line); border-radius: 999px; cursor: pointer;
      font-size: 0.85rem; font-weight: 700;
    }
    .chip.active { color: #fff; background: var(--teal-700); border-color: var(--teal-700); }

    .filter-menu { position: relative; }
    .control-button {
      display: inline-flex; align-items: center; gap: 7px;
      min-height: 30px; padding: 4px 10px; white-space: nowrap;
      background: var(--paper); border: 1px solid var(--line); border-radius: 9px; cursor: pointer;
      font-size: 0.84rem;
    }
    .control-button:hover { border-color: #a9bbc7; }
    .filter-popover {
      position: absolute; right: 0; top: calc(100% + 8px); z-index: 40;
      display: none; width: 250px; max-height: 320px; overflow-y: auto;
      padding: 10px; background: var(--paper);
      border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow);
    }
    .filter-popover.open { display: block; }
    .filter-option { display: flex; align-items: center; gap: 9px; padding: 4px 3px; cursor: pointer; font-size: 0.88rem; }
    .filter-option input { accent-color: var(--teal-700); }

    /* 補足3行は表と同じ枠内に置き、縦スクロール後は画面外へ流す。 */
    .scrolling-notes {
      position: sticky;
      left: 0;
      z-index: 3;
      width: 100%;
      padding: 5px 10px 4px;
      color: var(--muted);
      background: #fbfdfd;
      border-bottom: 1px solid #e8eef1;
      font-size: 0.72rem;
      line-height: 1.35;
    }
    .info-line {
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .info-line + .info-line { margin-top: 2px; }
    .info-line b { font-weight: 700; }
    .info-line .up { color: var(--up); }
    .info-line .down { color: var(--down); }

    /* 残りの高さをすべて表へ渡す。 */
    .content {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      padding: 6px clamp(10px, 2vw, 24px) 8px;
    }
    #matrix { min-width: 100%; }

    .table-scroll {
      flex: 1 1 auto;
      min-width: 0;
      overflow: auto;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 4px 18px rgba(11, 31, 51, 0.045);
    }
    table { border-collapse: separate; border-spacing: 0; width: max-content; min-width: 100%; }
    thead th {
      position: sticky; top: 0; z-index: 5;
      padding: 7px 8px;
      color: var(--muted); background: #f7fafa;
      font-size: 0.74rem; font-weight: 750; letter-spacing: 0.03em;
      text-align: center; white-space: nowrap;
      border-bottom: 1px solid var(--line);
    }
    thead th.col-bank, thead th.col-type { text-align: left; z-index: 7; }
    /* 最新列は従来どおりの幅、過去列は詰める */
    thead th.col-date { min-width: 102px; }
    thead th.col-date.past { min-width: 62px; padding: 7px 4px; }
    .date-year { display: block; color: #7b8b96; font-size: 0.65rem; font-weight: 650; }
    .date-day { display: block; margin-top: 1px; color: var(--navy-800); font-size: 0.82rem; }
    .col-date.past .date-year { font-size: 0.6rem; }
    .col-date.past .date-day { font-size: 0.74rem; }

    /* 全商品で金利が動かなかった週は、まとめて1本の細い列にする */
    thead th.col-nochange,
    tbody td.col-nochange {
      width: 54px; min-width: 54px; padding: 6px 3px;
      background: #f6fafb;
    }
    tbody td.col-nochange { border-bottom: 1px solid #eef2f4; }
    tbody tr:hover td.col-nochange { background: #f2f8f9; }
    .nochange-label { display: block; color: #8595a1; font-size: 0.65rem; font-weight: 800; }
    .nochange-range {
      display: block; margin-top: 2px; color: #a3b3bd;
      font-size: 0.58rem; font-weight: 650; font-variant-numeric: tabular-nums;
    }

    /* 余った横幅を吸収する空列。これが無いと過去列が引き伸ばされて太くなる */
    thead th.col-spacer, tbody td.col-spacer {
      width: 100%; min-width: 0; padding: 0; background: transparent;
    }
    tbody td {
      padding: 6px 8px; vertical-align: top;
      border-bottom: 1px solid #eef2f4;
      text-align: center; white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr:hover td { background: #fbfdfd; }

    /* 左側の固定列（機関・商品・種別）。横スクロールしても残る */
    .col-bank { position: sticky; left: 0; z-index: 4; width: 142px; min-width: 142px; padding: 6px 7px; text-align: left; background: var(--paper); box-shadow: 6px 0 10px -10px rgba(15,23,42,0.2); }
    .col-type { position: sticky; left: 142px; z-index: 4; width: 58px; min-width: 58px; padding: 6px 3px; text-align: left; background: var(--paper); box-shadow: 6px 0 10px -10px rgba(15,23,42,0.2); }
    thead th.col-bank { left: 0; padding: 7px; background: #f7fafa; }
    thead th.col-type { left: 142px; padding: 7px 3px; background: #f7fafa; }
    tbody tr:hover .col-bank, tbody tr:hover .col-type { background: #fbfdfd; }

    .bank-name { font-weight: 700; color: var(--navy-900); font-size: 0.82rem; white-space: normal; line-height: 1.25; }
    .bank-name a { color: var(--navy-800); text-decoration: none; }
    .bank-name a:hover { color: var(--teal-700); text-decoration: underline; }
    .product-name { margin-top: 1px; color: var(--muted); font-size: 0.71rem; white-space: normal; line-height: 1.25; }

    .type-badge {
      display: inline-block; padding: 2px 6px; border-radius: 999px;
      background: var(--teal-100); color: var(--teal-700);
      font-size: 0.71rem; font-weight: 750; white-space: nowrap;
    }

    .rate-cell.current { background: var(--teal-100); }
    tbody td.rate-cell.past { padding: 6px 4px; }
    .rate-cell.past .rate-val { font-size: 0.82rem; }
    .rate-val { font-size: 0.98rem; font-weight: 750; color: var(--navy-900); }
    .rate-cell.up .rate-val { color: var(--up); }
    .rate-cell.down .rate-val { color: var(--down); }
    .arrow { font-size: 0.82rem; }
    .rate-cell.up .arrow { color: var(--up); }
    .rate-cell.down .arrow { color: var(--down); }
    /* 過去列の最安値は、行を増やさず文字だけで判別できるようにする。 */
    .rate-cell.past-best .rate-val {
      color: #9a6700;
      font-weight: 900;
      text-decoration: underline;
      text-decoration-thickness: 2px;
      text-underline-offset: 3px;
    }
    .rate-empty { color: #c2ccd2; }
    .best-badge {
      display: inline-block; margin-top: 1px; padding: 1px 6px;
      background: #d59b2b; color: #fff;
      border-radius: 999px; font-size: 0.64rem; font-weight: 800; letter-spacing: 0.02em;
    }
    .rate-cell.best { background: #fff4d8; box-shadow: inset 0 0 0 1px #e6b84b; }

    /* 機関の変わり目を太い罫線で区切る */
    tbody tr.bank-start > td { border-top: 2px solid #8aa0af; }

    .empty-state, .loading-state {
      align-self: flex-start; width: 100%;
      padding: 40px 20px; text-align: center; color: var(--muted);
      background: var(--paper); border: 1px dashed #b9c8d1; border-radius: var(--radius);
    }
    .empty-state strong, .loading-state strong { display: block; margin-bottom: 5px; color: var(--navy-900); font-size: 1rem; }

    @media (max-width: 640px) {
      .col-bank { width: 112px; min-width: 112px; }
      .col-type { left: 112px; width: 50px; min-width: 50px; }
      thead th.col-type { left: 112px; }
      .site-header { gap: 10px; padding-inline: 10px; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="brand-mark"><span class="pulse-dot" aria-hidden="true"></span>金利履歴ビューアー</div>
    <p id="subtitle">帯広エリア 金融機関の住宅ローン金利を、共通の調査日で比較できます。左が最新、右が過去です。</p>
  </header>

  <div class="controls">
    <label class="search-wrap">
      <span class="search-icon" aria-hidden="true">⌕</span>
      <input id="searchInput" type="search" placeholder="金融機関・商品名で検索" aria-label="金融機関・商品名で検索" autocomplete="off">
    </label>
    <div class="type-chips" id="typeChips" role="group" aria-label="金利種別の切替（1つだけ表示）"></div>
    <div class="filter-menu" id="bankFilterWrap">
      <button class="control-button" id="filterButton" type="button" aria-expanded="false" aria-controls="filterPopover">
        機関を絞り込む <span id="filterCount"></span>
      </button>
      <div class="filter-popover" id="filterPopover">
        <div id="bankFilters"></div>
      </div>
    </div>
  </div>

  <div class="content">
    <div class="table-scroll" id="tableScroll">
      <div class="scrolling-notes">
        <div class="info-line"><b>各セル</b>＝列の日付に確認できた実金利（—＝未確認）　<span class="up"><b>↑</b> 前回調査より上昇</span>　<span class="down"><b>↓</b> 前回調査より低下</span>　<b>変更なし</b>＝表示中の全商品で金利が動いていない期間</div>
        <div class="info-line"><b>掲載範囲</b>＝公式サイトから毎週自動取得できる機関のみ（手動入力のみずほ銀行・JAめむろ・JA木野は対象外）　<span id="coverage"></span></div>
        <div id="sourceNote" class="info-line"></div>
      </div>
      <div id="matrix" aria-live="polite">
        <div class="loading-state"><strong>データを読み込んでいます</strong>しばらくお待ちください。</div>
      </div>
    </div>
  </div>

  <script>
    "use strict";

    const DATA_URL = "./data/rate-history.json";
    const state = {
      data: null,
      search: "",
      // 金利種別は「すべて」または1種別だけを表示する（null = すべて）
      selectedType: null,
      selectedBanks: new Set(),
    };

    const el = {
      matrix: document.getElementById("matrix"),
      searchInput: document.getElementById("searchInput"),
      typeChips: document.getElementById("typeChips"),
      bankFilters: document.getElementById("bankFilters"),
      filterButton: document.getElementById("filterButton"),
      filterPopover: document.getElementById("filterPopover"),
      filterCount: document.getElementById("filterCount"),
      coverage: document.getElementById("coverage"),
      sourceNote: document.getElementById("sourceNote"),
    };

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>'"]/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;"
      })[c]);
    }

    function safeUrl(value) {
      try {
        const url = new URL(value);
        return ["http:", "https:"].includes(url.protocol) ? escapeHtml(url.href) : "";
      } catch (_e) {
        return "";
      }
    }

    function isFiniteRate(rate) {
      return typeof rate === "number" && Number.isFinite(rate);
    }

    function fmtRate(rate) {
      return isFiniteRate(rate) ? rate.toFixed(3) + "%" : "—";
    }

    function fmtHeaderDate(date) {
      const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(date ?? ""));
      if (!m) return escapeHtml(String(date ?? ""));
      return `<span class="date-year">${m[1]}年</span><span class="date-day">${m[2]}/${m[3]}</span>`;
    }

    function entryDate(entry) {
      return entry?.observed_on || entry?.effective_from || "";
    }

    function observationDates() {
      const configured = state.data.observation_dates || [];
      if (configured.length) return [...configured];
      const dates = new Set();
      for (const row of state.data.rows || []) {
        for (const entry of row.history || []) dates.add(entryDate(entry));
      }
      return [...dates].filter(Boolean).sort().reverse();
    }

    function entryAt(row, date) {
      return (row.history || []).find((entry) => entryDate(entry) === date);
    }

    function typeLabel(rateType) {
      return (state.data.rate_type_labels || {})[rateType] || rateType;
    }

    function bankOrder() {
      // JSON内での機関の初出順を機関の並び順とする
      const order = [];
      for (const row of state.data.rows) {
        if (!order.includes(row.bank_id)) order.push(row.bank_id);
      }
      return order;
    }

    function sortedRows(rows) {
      const banks = bankOrder();
      const typeOrder = state.data.rate_type_order || [];
      return [...rows].sort((a, b) => {
        const bi = banks.indexOf(a.bank_id) - banks.indexOf(b.bank_id);
        if (bi !== 0) return bi;
        if (a.product_id !== b.product_id) return String(a.product_id).localeCompare(String(b.product_id));
        return typeOrder.indexOf(a.rate_type) - typeOrder.indexOf(b.rate_type);
      });
    }

    function visibleRows() {
      const q = state.search.trim().toLocaleLowerCase("ja");
      return state.data.rows.filter((row) => {
        if (state.selectedType && row.rate_type !== state.selectedType) return false;
        if (!state.selectedBanks.has(row.bank_id)) return false;
        if (!q) return true;
        return (
          String(row.bank_name ?? "").toLocaleLowerCase("ja").includes(q) ||
          String(row.product_name ?? "").toLocaleLowerCase("ja").includes(q)
        );
      });
    }

    function rateCell(entry, older, isCurrent, isBest) {
      const base = isCurrent ? "current" : "past";
      if (!entry) return `<td class="rate-cell ${base}"><span class="rate-empty">—</span></td>`;
      let dir = "";
      let arrow = "";
      if (older && isFiniteRate(entry.rate) && isFiniteRate(older.rate)) {
        if (entry.rate > older.rate) { dir = "up"; arrow = " <span class=\"arrow\">↑</span>"; }
        else if (entry.rate < older.rate) { dir = "down"; arrow = " <span class=\"arrow\">↓</span>"; }
      }
      const bestClass = isBest ? (isCurrent ? "best" : "past-best") : "";
      const cls = ["rate-cell", base, bestClass, dir].filter(Boolean).join(" ");
      const badge = isCurrent && isBest ? '<div class="best-badge">最安</div>' : "";
      const value = isCurrent
        ? `<div class="rate-val">${fmtRate(entry.rate)}${arrow}</div>`
        : `<span class="rate-val">${fmtRate(entry.rate)}${arrow}</span>`;
      return `<td class="${cls}">
        ${value}
        ${badge}
      </td>`;
    }

    function sameRate(a, b) {
      const av = a && isFiniteRate(a.rate) ? a.rate : null;
      const bv = b && isFiniteRate(b.rate) ? b.rate : null;
      return av === bv;
    }

    function shortDate(date) {
      const m = /^\d{4}-(\d{2})-(\d{2})$/.exec(String(date ?? ""));
      return m ? `${m[1]}/${m[2]}` : String(date ?? "");
    }

    function buildColumns(rows, dates) {
      // 過去列のうち「1つ右（より古い列）と表示中の全行が同値」＝その週は誰も動いていない列を畳む。
      // 最新列と最古列は基準として必ず残す（最古を消すと比較の起点が無くなる）。
      const redundant = dates.map(() => false);
      for (let i = 1; i < dates.length - 1; i += 1) {
        redundant[i] = rows.every((row) => sameRate(entryAt(row, dates[i]), entryAt(row, dates[i + 1])));
      }
      const columns = [];
      for (let i = 0; i < dates.length; i += 1) {
        if (!redundant[i]) {
          columns.push({ kind: "date", date: dates[i], index: i });
          continue;
        }
        let last = i;
        while (last + 1 < dates.length && redundant[last + 1]) last += 1;
        columns.push({ kind: "nochange", from: dates[i], to: dates[last], count: last - i + 1 });
        i = last;
      }
      return columns;
    }

    function nochangeRange(col) {
      return col.count === 1 ? shortDate(col.from) : `${shortDate(col.from)}〜${shortDate(col.to)}`;
    }

    function minRateByDateAndType(rows, dates) {
      // 表示中の行から、各調査日×金利種別の最安値を求める。絞り込み後も毎回再計算する。
      const minimums = {};
      for (const date of dates) {
        minimums[date] = {};
        for (const row of rows) {
          const entry = entryAt(row, date);
          if (!entry || !isFiniteRate(entry.rate)) continue;
          const type = row.rate_type;
          const rate = entry.rate;
          if (!(type in minimums[date]) || rate < minimums[date][type]) {
            minimums[date][type] = rate;
          }
        }
      }
      return minimums;
    }

    function render() {
      const rows = sortedRows(visibleRows());
      if (!rows.length) {
        el.matrix.innerHTML = '<div class="empty-state"><strong>該当する金利がありません</strong>検索語・種別・機関の絞り込みを変えてください。</div>';
        return;
      }
      const dates = observationDates();
      if (!dates.length) {
        el.matrix.innerHTML = '<div class="empty-state"><strong>調査日データがありません</strong>金利履歴JSONをご確認ください。</div>';
        return;
      }
      const minimums = minRateByDateAndType(rows, dates);
      const columns = buildColumns(rows, dates);

      const thead = `<tr>
        <th class="col-bank">金融機関・商品</th>
        <th class="col-type">種別</th>
        ${columns.map((col) => col.kind === "date"
          ? `<th class="col-date${col.index === 0 ? "" : " past"}">${fmtHeaderDate(col.date)}</th>`
          : `<th class="col-nochange" title="${escapeHtml(nochangeRange(col))} は表示中の全商品で金利変更なし"><span class="nochange-label">変更なし</span><span class="nochange-range">${escapeHtml(nochangeRange(col))}</span></th>`
        ).join("")}
        <th class="col-spacer" aria-hidden="true"></th>
      </tr>`;

      const body = rows.map((row, idx) => {
        const prev = rows[idx - 1];
        // 機関の変わり目（太い罫線を引く行）
        const isBankStart = Boolean(prev) && prev.bank_id !== row.bank_id;
        // 機関名セルは(機関×商品)単位で結合する。グループ先頭でのみ出力。
        const groupStart = !prev || prev.bank_id !== row.bank_id || prev.product_id !== row.product_id;

        const cells = columns.map((col) => {
          if (col.kind === "nochange") return '<td class="col-nochange"></td>';
          const i = col.index;
          const entry = entryAt(row, dates[i]);
          const older = i + 1 < dates.length ? entryAt(row, dates[i + 1]) : null;
          const isBest = Boolean(entry)
            && isFiniteRate(entry.rate)
            && entry.rate === minimums[col.date][row.rate_type];
          return rateCell(entry, older, i === 0, isBest);
        });

        let bankCell = "";
        if (groupStart) {
          let span = 1;
          for (let j = idx + 1; j < rows.length; j += 1) {
            if (rows[j].bank_id === row.bank_id && rows[j].product_id === row.product_id) span += 1;
            else break;
          }
          const url = row.url ? safeUrl(row.url) : "";
          const bankHtml = url
            ? `<a href="${url}" target="_blank" rel="noopener noreferrer">${escapeHtml(row.bank_name)}</a>`
            : escapeHtml(row.bank_name);
          bankCell = `<td class="col-bank" rowspan="${span}">
            <div class="bank-name">${bankHtml}</div>
            <div class="product-name">${escapeHtml(row.product_name || "")}</div>
          </td>`;
        }

        return `<tr${isBankStart ? ' class="bank-start"' : ""}>
          ${bankCell}
          <td class="col-type"><span class="type-badge">${escapeHtml(typeLabel(row.rate_type))}</span></td>
          ${cells.join("")}
          <td class="col-spacer"></td>
        </tr>`;
      }).join("");

      el.matrix.innerHTML = `<table><thead>${thead}</thead><tbody>${body}</tbody></table>`;
      el.coverage.textContent = `${dates[dates.length - 1].replaceAll("-", "/")}〜${dates[0].replaceAll("-", "/")}（${dates.length}調査日）`;
      const sourceLabels = (state.data.data_sources || []).map((source) => source.description).filter(Boolean);
      el.sourceNote.textContent = sourceLabels.length ? `出典：${sourceLabels.join("、")}` : "";
    }

    function buildTypeChips() {
      const order = state.data.rate_type_order || [];
      state.selectedType = null;
      const chips = [`<button type="button" class="chip active" data-type="">すべて</button>`];
      for (const t of order) {
        chips.push(`<button type="button" class="chip" data-type="${escapeHtml(t)}">${escapeHtml(typeLabel(t))}</button>`);
      }
      el.typeChips.innerHTML = chips.join("");
    }

    function syncTypeChips() {
      el.typeChips.querySelectorAll("[data-type]").forEach((chip) => {
        chip.classList.toggle("active", (chip.dataset.type || null) === state.selectedType);
      });
    }

    function buildBankFilters() {
      const seen = new Map();
      for (const row of state.data.rows) {
        if (!seen.has(row.bank_id)) seen.set(row.bank_id, row.bank_name);
      }
      state.selectedBanks = new Set(seen.keys());
      el.bankFilters.innerHTML = [...seen.entries()].map(([id, name]) =>
        `<label class="filter-option"><input type="checkbox" value="${escapeHtml(id)}" checked> ${escapeHtml(name)}</label>`
      ).join("");
      updateFilterCount();
    }

    function updateFilterCount() {
      const total = new Set(state.data.rows.map((r) => r.bank_id)).size;
      el.filterCount.textContent = total ? `(${state.selectedBanks.size}/${total})` : "";
    }

    el.searchInput.addEventListener("input", () => { state.search = el.searchInput.value; render(); });

    el.typeChips.addEventListener("click", (event) => {
      const chip = event.target.closest("[data-type]");
      if (!chip) return;
      const type = chip.dataset.type || null;
      // 選んだ種別だけを表示する。選択中のものをもう一度押すと「すべて」に戻る
      state.selectedType = state.selectedType === type ? null : type;
      syncTypeChips();
      render();
    });

    el.filterButton.addEventListener("click", () => {
      const open = el.filterPopover.classList.toggle("open");
      el.filterButton.setAttribute("aria-expanded", String(open));
    });

    el.bankFilters.addEventListener("change", (event) => {
      if (event.target.type !== "checkbox") return;
      if (event.target.checked) state.selectedBanks.add(event.target.value);
      else state.selectedBanks.delete(event.target.value);
      updateFilterCount();
      render();
    });

    document.addEventListener("click", (event) => {
      if (!event.target.closest(".filter-menu")) {
        el.filterPopover.classList.remove("open");
        el.filterButton.setAttribute("aria-expanded", "false");
      }
    });

    async function initialize() {
      try {
        const response = await fetch(DATA_URL);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        state.data = await response.json();
        if (!state.data.rows || !state.data.rows.length) {
          el.matrix.innerHTML = '<div class="empty-state"><strong>金利データがありません</strong>データが蓄積されると、ここに履歴が表示されます。</div>';
          return;
        }
        buildTypeChips();
        buildBankFilters();
        render();
      } catch (_e) {
        el.matrix.innerHTML = '<div class="empty-state"><strong>データを読み込めませんでした</strong>HTTPサーバー経由で開いているか、data/rate-history.json があるかご確認ください。</div>';
      }
    }

    initialize();
  </script>
</body>
</html>
