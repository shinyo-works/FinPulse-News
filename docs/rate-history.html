<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="帯広エリアの金融機関の住宅ローン金利を、種別ごとに過去まで遡れる金利履歴ビューアー">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230b1f33'/><path d='M16 5 L28 12 H4 Z' fill='%2355d6c9'/><rect x='7' y='14' width='3.4' height='9' fill='%2355d6c9'/><rect x='14.3' y='14' width='3.4' height='9' fill='%2355d6c9'/><rect x='21.6' y='14' width='3.4' height='9' fill='%2355d6c9'/><rect x='5' y='24.5' width='22' height='3' rx='1.2' fill='%2355d6c9'/></svg>">
  <title>十勝金融機関News｜金利情報</title>
  <style>
    :root {
      --navy-950: #0b1f33;
      --navy-900: #102a43;
      --navy-800: #173e5e;
      --teal-700: #0d6e6e;
      --teal-600: #138484;
      --teal-100: #dff3f1;
      --up: #c0392b;
      --up-bg: #fdecea;
      --down: #0d6e6e;
      --down-bg: #e3f4f1;
      --ink: #172b3a;
      --muted: #647684;
      --line: #d9e2e8;
      --paper: #ffffff;
      --canvas: #f4f7f8;
      --shadow: 0 10px 30px rgba(11, 31, 51, 0.08);
      --radius: 14px;
      /* 「金融機関・商品」列の幅。ヘッダー右端のハンドルで変更し、localStorage に残す。
         種別列の sticky 位置もこの値に追従させるので、変更はこの1か所だけで済ませる。 */
      --bank-col-w: 142px;
    }

    * { box-sizing: border-box; }
    html { color-scheme: light; }
    /* ページ全体は固定し、補足情報と表を同じ枠の中でスクロールさせる。 */
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      color: var(--ink);
      background: var(--canvas);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif;
      line-height: 1.4;
    }
    button, input { font: inherit; }
    button { color: inherit; }

    /* index.html のタブ内（iframe）に表示するため、見出しは控えめの高さにする */
    .site-header {
      flex: none;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 8px clamp(12px, 3vw, 36px);
      color: #eef7fa;
      background:
        radial-gradient(circle at 12% 0%, rgba(32, 144, 139, 0.32), transparent 34%),
        var(--navy-950);
    }
    .brand-mark {
      display: inline-flex;
      flex: none;
      align-items: center;
      gap: 10px;
      font-size: 1.02rem;
      font-weight: 750;
      letter-spacing: 0.02em;
    }
    .pulse-dot {
      width: 11px; height: 11px; border-radius: 50%;
      background: #55d6c9; box-shadow: 0 0 0 5px rgba(85, 214, 201, 0.15);
    }
    /* 説明文は見出しの右側で、従来の文字サイズのまま1行に収める。 */
    .site-header p {
      flex: 1 1 auto;
      min-width: 0;
      margin: 0;
      color: #a9c0ce;
      font-size: 0.8rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .controls {
      flex: none;
      z-index: 20;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      padding: 5px clamp(12px, 3vw, 36px);
      background: rgba(244, 247, 248, 0.95);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(10px);
    }
    /* プレースホルダ「金融機関・商品名で検索」を末尾まで出せる幅を確保する */
    .search-wrap { position: relative; flex: 0 1 250px; min-width: 215px; }
    .search-icon {
      position: absolute; left: 11px; top: 50%;
      color: var(--muted); transform: translateY(-50%); pointer-events: none;
    }
    #searchInput {
      width: 100%;
      height: 30px;
      padding: 3px 10px 3px 31px;
      color: var(--ink); background: var(--paper);
      border: 1px solid var(--line); border-radius: 9px; outline: none;
      font-size: 0.84rem;
    }
    #searchInput:focus { border-color: var(--teal-600); box-shadow: 0 0 0 3px rgba(19,132,132,0.13); }

    .type-chips { display: flex; flex-wrap: wrap; gap: 4px; }
    .chip {
      padding: 4px 10px;
      color: var(--navy-800); background: var(--paper);
      border: 1px solid var(--line); border-radius: 999px; cursor: pointer;
      font-size: 0.85rem; font-weight: 700;
    }
    .chip.active { color: #fff; background: var(--teal-700); border-color: var(--teal-700); }

    .filter-menu { position: relative; }
    .control-button {
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      min-height: 30px; min-width: 190px; padding: 4px 16px; white-space: nowrap;
      background: var(--paper); border: 1px solid var(--line); border-radius: 9px; cursor: pointer;
      font-size: 0.84rem;
    }
    .control-button:hover { border-color: #a9bbc7; }
    .filter-popover {
      position: absolute; right: 0; top: calc(100% + 8px); z-index: 40;
      display: none; width: 280px; max-height: 320px; overflow-y: auto;
      padding: 10px; background: var(--paper);
      border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow);
    }
    .filter-popover.open { display: block; }
    .filter-option { display: flex; align-items: center; gap: 9px; padding: 4px 3px; cursor: pointer; font-size: 0.88rem; }
    .filter-option input { accent-color: var(--teal-700); }

    /* 補足3行は表と同じ枠内に置き、縦スクロール後は画面外へ流す。 */
    .scrolling-notes {
      position: sticky;
      left: 0;
      z-index: 3;
      width: 100%;
      padding: 5px 10px 4px;
      color: var(--muted);
      background: #fbfdfd;
      border-bottom: 1px solid #e8eef1;
      font-size: 0.72rem;
      line-height: 1.35;
    }
    .info-line {
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .info-line + .info-line { margin-top: 2px; }
    .info-line b { font-weight: 700; }
    .info-line .up { color: var(--up); }
    .info-line .down { color: var(--down); }

    /* 残りの高さをすべて表へ渡す。 */
    .content {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      padding: 6px clamp(10px, 2vw, 24px) 8px;
    }
    #matrix { min-width: 100%; }

    .table-scroll {
      flex: 1 1 auto;
      min-width: 0;
      overflow: auto;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 4px 18px rgba(11, 31, 51, 0.045);
    }
    table { border-collapse: separate; border-spacing: 0; width: max-content; min-width: 100%; }
    thead th {
      position: sticky; top: 0; z-index: 5;
      padding: 7px 8px;
      color: var(--muted); background: #f7fafa;
      font-size: 0.74rem; font-weight: 750; letter-spacing: 0.03em;
      text-align: center; white-space: nowrap;
      border-bottom: 1px solid var(--line);
    }
    thead th.col-bank, thead th.col-type { text-align: left; z-index: 7; }
    /* 最新列は従来どおりの幅、過去列は詰める */
    thead th.col-date { min-width: 102px; }
    thead th.col-date.past { min-width: 62px; padding: 7px 4px; }
    .date-year { display: block; color: #7b8b96; font-size: 0.65rem; font-weight: 650; }
    .date-day { display: block; margin-top: 1px; color: var(--navy-800); font-size: 0.82rem; }
    .col-date.past .date-year { font-size: 0.6rem; }
    .col-date.past .date-day { font-size: 0.74rem; }

    /* 全商品で金利が動かなかった週は、まとめて1本の細い列にする */
    thead th.col-nochange,
    tbody td.col-nochange {
      width: 54px; min-width: 54px; padding: 6px 3px;
      background: #f6fafb;
    }
    tbody td.col-nochange { border-bottom: 1px solid #eef2f4; }
    tbody tr:hover td.col-nochange { background: #f2f8f9; }
    .nochange-label { display: block; color: #8595a1; font-size: 0.65rem; font-weight: 800; }
    /* 読み飛ばしてよい畳み列だが、読もうとしたときに読める濃さは確保する */
    .nochange-range {
      display: block; margin-top: 2px; color: var(--muted);
      font-size: 0.58rem; font-weight: 650; font-variant-numeric: tabular-nums;
    }

    /* 余った横幅を吸収する空列。これが無いと過去列が引き伸ばされて太くなる */
    thead th.col-spacer, tbody td.col-spacer {
      width: 100%; min-width: 0; padding: 0; background: transparent;
    }
    tbody td {
      padding: 6px 8px; vertical-align: top;
      border-bottom: 1px solid #eef2f4;
      text-align: center; white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr:hover td { background: #fbfdfd; }

    /* 左側の固定列（機関・商品・種別）。横スクロールしても残る */
    .col-bank { position: sticky; left: 0; z-index: 4; width: var(--bank-col-w); min-width: var(--bank-col-w); max-width: var(--bank-col-w); padding: 6px 7px; text-align: left; background: var(--paper); box-shadow: 6px 0 10px -10px rgba(15,23,42,0.2); }
    .col-type { position: sticky; left: var(--bank-col-w); z-index: 4; width: 58px; min-width: 58px; padding: 6px 3px; text-align: left; background: var(--paper); box-shadow: 6px 0 10px -10px rgba(15,23,42,0.2); }
    thead th.col-bank { left: 0; padding: 7px 12px 7px 7px; background: #f7fafa; }
    thead th.col-type { left: var(--bank-col-w); padding: 7px 3px; background: #f7fafa; }
    tbody tr:hover .col-bank, tbody tr:hover .col-type { background: #fbfdfd; }

    /* 幅の変更ハンドル。列の境目に重ねるので、掴める幅（9px）だけ確保して見た目は線1本にする。 */
    .col-resizer {
      position: absolute; top: 0; right: -4px; z-index: 8;
      width: 9px; height: 100%;
      padding: 0; background: none; border: 0;
      cursor: col-resize; touch-action: none;
    }
    .col-resizer::before {
      content: ""; position: absolute; top: 4px; bottom: 4px; left: 4px;
      width: 2px; border-radius: 2px; background: #c3d0d8;
    }
    .col-resizer:hover::before, .col-resizer:focus-visible::before, .col-resizer.dragging::before { background: var(--teal-600); }
    .col-resizer:focus-visible { outline: 2px solid var(--teal-600); outline-offset: 1px; }
    /* ドラッグ中は表側のテキスト選択が始まらないようにする */
    body.resizing-col { cursor: col-resize; user-select: none; }

    .bank-name { font-weight: 700; color: var(--navy-900); font-size: 0.82rem; white-space: normal; line-height: 1.25; }
    .bank-name a { color: var(--navy-800); text-decoration: none; }
    .bank-name a:hover { color: var(--teal-700); text-decoration: underline; }
    .product-name { margin-top: 1px; color: var(--muted); font-size: 0.71rem; white-space: normal; line-height: 1.25; }
    .guarantee-note { margin-top: 2px; color: #b91c1c; font-size: 0.68rem; font-weight: 600; white-space: normal; line-height: 1.2; }
    /* 住宅ローンの保証料・事務手数料。既定は控えめにし、保証料が別途の商品を赤、
       条件次第で別途負担が生じる商品・記載が無く不明な商品を橙で立てる */
    .feature-note { margin-top: 2px; color: #5c6f7c; font-size: 0.66rem; font-weight: 600; white-space: normal; line-height: 1.2; }
    .feature-note.warn { color: #b91c1c; }
    .feature-note.caution { color: #a4530a; }

    .type-badge {
      display: inline-block; padding: 2px 6px; border-radius: 999px;
      background: var(--teal-100); color: var(--teal-700);
      font-size: 0.71rem; font-weight: 750; white-space: nowrap;
    }

    .rate-cell.current { background: var(--teal-100); }
    tbody td.rate-cell.past { padding: 6px 4px; }
    .rate-cell.past .rate-val { font-size: 0.82rem; }
    .rate-val { font-size: 0.98rem; font-weight: 750; color: var(--navy-900); }
    .rate-cell.up .rate-val { color: var(--up); }
    .rate-cell.down .rate-val { color: var(--down); }
    .arrow { font-size: 0.82rem; }
    .rate-cell.up .arrow { color: var(--up); }
    .rate-cell.down .arrow { color: var(--down); }
    /* 過去列の最安値は、行を増やさず文字だけで判別できるようにする。 */
    .rate-cell.past-best .rate-val {
      color: #9a6700;
      font-weight: 900;
      text-decoration: underline;
      text-decoration-thickness: 2px;
      text-underline-offset: 3px;
    }
    .rate-empty { color: #c2ccd2; }
    .best-badge {
      display: inline-block; margin-top: 1px; padding: 1px 6px;
      background: #d59b2b; color: #fff;
      border-radius: 999px; font-size: 0.64rem; font-weight: 800; letter-spacing: 0.02em;
    }
    .rate-cell.best { background: #fff4d8; box-shadow: inset 0 0 0 1px #e6b84b; }

    /* 機関の変わり目を太い罫線で区切る */
    tbody tr.bank-start > td { border-top: 2px solid #8aa0af; }

    .empty-state, .loading-state {
      align-self: flex-start; width: 100%;
      padding: 40px 20px; text-align: center; color: var(--muted);
      background: var(--paper); border: 1px dashed #b9c8d1; border-radius: var(--radius);
    }
    .empty-state strong, .loading-state strong { display: block; margin-bottom: 5px; color: var(--navy-900); font-size: 1rem; }

    /* 表は左が最新の逆時系列のため、この説明が切れると誤読につながる。
       狭い画面では全文を諦め、読み方だけを必ず表示する。 */
    .subtitle-short { display: none; }

    /* 親ページ（タブ表示）に埋め込まれているときは、見出しをタブ行の右側に出すので重複させない */
    body.embedded .site-header { display: none; }

    @media (max-width: 640px) {
      /* 幅を自分で決めていない端末だけ既定値を狭める（明示指定はインライン変数が優先される） */
      :root { --bank-col-w: 112px; }
      .col-type { width: 50px; min-width: 50px; }
      .site-header { gap: 10px; padding-inline: 10px; }
      .subtitle-full { display: none; }
      .subtitle-short { display: inline; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="brand-mark"><span class="pulse-dot" aria-hidden="true"></span>金利履歴ビューアー</div>
    <p id="subtitle"><span class="subtitle-full" id="subtitleFull">帯広エリア 金融機関の住宅ローン金利を、共通の調査日で比較できます。左が最新、右が過去です。</span><span class="subtitle-short">左が最新、右が過去です。</span></p>
  </header>

  <div class="controls">
    <label class="search-wrap">
      <span class="search-icon" aria-hidden="true">⌕</span>
      <input id="searchInput" type="search" placeholder="金融機関・商品名で検索" aria-label="金融機関・商品名で検索" autocomplete="off">
    </label>
    <div class="type-chips" id="typeChips" role="group" aria-label="金利種別の切替（1つだけ表示）"></div>
    <div class="filter-menu" id="bankFilterWrap">
      <button class="control-button" id="filterButton" type="button" aria-expanded="false" aria-controls="filterPopover">
        金融機関を絞り込む <span id="filterCount"></span>
      </button>
      <div class="filter-popover" id="filterPopover">
        <div id="bankFilters"></div>
      </div>
    </div>
  </div>

  <div class="content">
    <div class="table-scroll" id="tableScroll">
      <div class="scrolling-notes">
        <div class="info-line"><b>各セル</b>＝列の日付に確認できた実金利（—＝未確認）　<span class="up"><b>↑</b> 前回調査より上昇</span>　<span class="down"><b>↓</b> 前回調査より低下</span>　<b>変更なし</b>＝表示中の全商品で金利が動いていない期間</div>
        <div class="info-line"><b>掲載範囲</b>＝<span id="coverageScope">公式サイトから毎週自動取得できる機関のみ（手動入力のみずほ銀行・JAめむろ・JA木野は対象外）</span>　<span id="coverage"></span></div>
        <div id="guaranteeNote" class="info-line" hidden></div>
        <div id="sourceNote" class="info-line"></div>
      </div>
      <div id="matrix" aria-live="polite">
        <div class="loading-state"><strong>データを読み込んでいます</strong>しばらくお待ちください。</div>
      </div>
    </div>
  </div>

  <script>
    "use strict";

    // iframe 内（タブ表示）かどうか。単体で開いたときは従来どおり見出しを出す。
    if (window.self !== window.top) document.body.classList.add("embedded");

    // 表示するローン種別は ?dataset= で切り替える。定義済みの種別だけを受け付け、
    // 未知の値や指定なしは住宅ローンに落とす（URLの値をそのまま取得先にしない）。
    const DATASETS = {
      housing: {
        dataUrl: "./data/rate-history.json",
        title: "十勝金融機関News｜金利情報",
        subtitleFull: "帯広エリア 金融機関の住宅ローン金利を、共通の調査日で比較できます。左が最新、右が過去です。",
        coverageScope: "公式サイトから毎週自動取得できる機関のみ（手動入力のみずほ銀行・JAめむろ・JA木野は対象外）",
        // 住宅ローンは保証料の扱いが機関ごとに割れる（同じ北陸銀行でも定額型は別途・定率型は込み）。
        // 金利だけを並べると実質の負担を読み違えるため、商品ごとの条件を機関名の下に添える。
        featuresUrl: "./data/loan-features.json",
        featuresNote: "機関名の下の2行＝保証料の扱いと事務手数料。詳しい条件は「住宅ローンの条件比較」タブをご覧ください。",
      },
      car: {
        dataUrl: "./data/car-loan-history.json",
        title: "十勝金融機関News｜マイカーローン金利情報",
        subtitleFull: "帯広エリア 金融機関のマイカーローン金利（優遇後）を、共通の調査日で比較できます。左が最新、右が過去です。",
        coverageScope: "公式サイトでマイカーローンの優遇後金利を公表している機関のみ（窓口確認の機関は対象外）",
        // 住宅ローンは機関ごとに保証料の扱いが分かれる（JAは保証料別）ため凡例を出さない。
        // マイカーローンは9機関すべてが保証料込を明記しているので、表の上で一度だけ断る。
        guaranteeNote: "表示金利はすべて保証料込です（金利に保証料を含む）。上乗せがある機関は機関名の下に注記しています。",
      },
    };
    const DATASET_KEY = new URLSearchParams(location.search).get("dataset");
    const DATASET = DATASETS[DATASET_KEY] || DATASETS.housing;
    const DATA_URL = DATASET.dataUrl;
    document.title = DATASET.title;
    document.getElementById("subtitleFull").textContent = DATASET.subtitleFull;
    document.getElementById("coverageScope").textContent = DATASET.coverageScope;
    if (DATASET.guaranteeNote || DATASET.featuresNote) {
      const guaranteeEl = document.getElementById("guaranteeNote");
      guaranteeEl.textContent = `■ ${DATASET.guaranteeNote || DATASET.featuresNote}`;
      guaranteeEl.hidden = false;
    }
    const state = {
      data: null,
      search: "",
      // 金利種別は「すべて」または1種別だけを表示する（null = すべて）
      selectedType: null,
      selectedBanks: new Set(),
      // product_id をキーにした商品条件（保証料・事務手数料）。読めなくても金利表は出す。
      features: new Map(),
    };

    const el = {
      matrix: document.getElementById("matrix"),
      searchInput: document.getElementById("searchInput"),
      typeChips: document.getElementById("typeChips"),
      bankFilters: document.getElementById("bankFilters"),
      filterButton: document.getElementById("filterButton"),
      filterPopover: document.getElementById("filterPopover"),
      filterCount: document.getElementById("filterCount"),
      coverage: document.getElementById("coverage"),
      sourceNote: document.getElementById("sourceNote"),
    };

    // ---- 「金融機関・商品」列の幅調整 --------------------------------------
    // 機関名も商品名も長さがまちまちで、折り返しの見やすい幅は人によって違う。
    // ヘッダー右端のハンドルをドラッグ（キーボードなら矢印キー）で変え、
    // データセット別に localStorage へ残す。ダブルクリックで既定へ戻す。
    const BANK_COL = {
      min: 90,
      max: 460,
      step: 8,
      storageKey: `finpulse.rateHistory.bankColWidth.${DATASETS[DATASET_KEY] ? DATASET_KEY : "housing"}`,
    };

    function defaultBankColWidth() {
      // 既定値は CSS 側（画面幅で変わる）を正とする。インライン指定を外してから読む。
      const inline = document.documentElement.style.getPropertyValue("--bank-col-w");
      document.documentElement.style.removeProperty("--bank-col-w");
      const value = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--bank-col-w"));
      if (inline) document.documentElement.style.setProperty("--bank-col-w", inline);
      return Number.isFinite(value) ? value : 142;
    }

    function currentBankColWidth() {
      const value = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--bank-col-w"));
      return Number.isFinite(value) ? value : defaultBankColWidth();
    }

    function applyBankColWidth(width, persist) {
      const clamped = Math.round(Math.min(BANK_COL.max, Math.max(BANK_COL.min, width)));
      document.documentElement.style.setProperty("--bank-col-w", `${clamped}px`);
      const handle = el.matrix.querySelector(".col-resizer");
      if (handle) handle.setAttribute("aria-valuenow", String(clamped));
      if (persist) {
        try { localStorage.setItem(BANK_COL.storageKey, String(clamped)); } catch (_e) { /* 保存できなくても操作は続けられる */ }
      }
      return clamped;
    }

    function resetBankColWidth() {
      document.documentElement.style.removeProperty("--bank-col-w");
      try { localStorage.removeItem(BANK_COL.storageKey); } catch (_e) { /* noop */ }
      const handle = el.matrix.querySelector(".col-resizer");
      if (handle) handle.setAttribute("aria-valuenow", String(Math.round(currentBankColWidth())));
    }

    function restoreBankColWidth() {
      let saved = null;
      try { saved = localStorage.getItem(BANK_COL.storageKey); } catch (_e) { saved = null; }
      const width = parseFloat(saved ?? "");
      if (Number.isFinite(width)) applyBankColWidth(width, false);
    }

    function resizerHtml() {
      const width = Math.round(currentBankColWidth());
      return `<button type="button" class="col-resizer" role="separator" aria-orientation="vertical"
        aria-label="金融機関・商品の列幅を変更（矢印キーで調整、ダブルクリックで既定に戻す）"
        aria-valuemin="${BANK_COL.min}" aria-valuemax="${BANK_COL.max}" aria-valuenow="${width}"
        title="ドラッグで列幅を変更（ダブルクリックで既定に戻す）"></button>`;
    }

    function startBankColResize(event) {
      const handle = event.target.closest(".col-resizer");
      if (!handle || event.button !== 0) return;
      event.preventDefault();
      const startX = event.clientX;
      const startWidth = currentBankColWidth();
      handle.classList.add("dragging");
      document.body.classList.add("resizing-col");

      const onMove = (moveEvent) => applyBankColWidth(startWidth + (moveEvent.clientX - startX), false);
      const onEnd = (endEvent) => {
        applyBankColWidth(startWidth + (endEvent.clientX - startX), true);
        handle.classList.remove("dragging");
        document.body.classList.remove("resizing-col");
        window.removeEventListener("pointermove", onMove);
        window.removeEventListener("pointerup", onEnd);
        window.removeEventListener("pointercancel", onCancel);
      };
      const onCancel = () => {
        applyBankColWidth(startWidth, false);
        handle.classList.remove("dragging");
        document.body.classList.remove("resizing-col");
        window.removeEventListener("pointermove", onMove);
        window.removeEventListener("pointerup", onEnd);
        window.removeEventListener("pointercancel", onCancel);
      };
      window.addEventListener("pointermove", onMove);
      window.addEventListener("pointerup", onEnd);
      window.addEventListener("pointercancel", onCancel);
    }

    // 表は render() ごとに作り直されるので、ハンドルの操作は matrix への委譲で受ける。
    el.matrix.addEventListener("pointerdown", startBankColResize);
    el.matrix.addEventListener("dblclick", (event) => {
      if (event.target.closest(".col-resizer")) resetBankColWidth();
    });
    el.matrix.addEventListener("keydown", (event) => {
      if (!event.target.closest(".col-resizer")) return;
      const step = event.shiftKey ? BANK_COL.step * 3 : BANK_COL.step;
      if (event.key === "ArrowLeft") applyBankColWidth(currentBankColWidth() - step, true);
      else if (event.key === "ArrowRight") applyBankColWidth(currentBankColWidth() + step, true);
      else if (event.key === "Home" || event.key === "Escape") resetBankColWidth();
      else return;
      event.preventDefault();
    });
    restoreBankColWidth();
    // ------------------------------------------------------------------------

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>'"]/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;"
      })[c]);
    }

    function safeUrl(value) {
      try {
        const url = new URL(value);
        return ["http:", "https:"].includes(url.protocol) ? escapeHtml(url.href) : "";
      } catch (_e) {
        return "";
      }
    }

    function isFiniteRate(rate) {
      return typeof rate === "number" && Number.isFinite(rate);
    }

    function fmtRate(rate) {
      return isFiniteRate(rate) ? rate.toFixed(3) + "%" : "—";
    }

    function fmtHeaderDate(date) {
      const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(date ?? ""));
      if (!m) return escapeHtml(String(date ?? ""));
      return `<span class="date-year">${m[1]}年</span><span class="date-day">${m[2]}/${m[3]}</span>`;
    }

    function entryDate(entry) {
      return entry?.observed_on || entry?.effective_from || "";
    }

    function observationDates() {
      const configured = state.data.observation_dates || [];
      if (configured.length) return [...configured];
      const dates = new Set();
      for (const row of state.data.rows || []) {
        for (const entry of row.history || []) dates.add(entryDate(entry));
      }
      return [...dates].filter(Boolean).sort().reverse();
    }

    function entryAt(row, date) {
      return (row.history || []).find((entry) => entryDate(entry) === date);
    }

    function typeLabel(rateType) {
      return (state.data.rate_type_labels || {})[rateType] || rateType;
    }

    function bankOrder() {
      // JSON内での機関の初出順を機関の並び順とする
      const order = [];
      for (const row of state.data.rows) {
        if (!order.includes(row.bank_id)) order.push(row.bank_id);
      }
      return order;
    }

    // 機関名の下に出す2行（保証料の扱い・事務手数料）。条件データが無い商品では何も出さない。
    function featureNotesHtml(row) {
      const feature = state.features.get(row.product_id);
      if (!feature) return "";
      const lines = [];
      if (feature.guarantee_note) {
        // included=灰（負担なし）／separate=赤（必ず別途）／conditional=橙（条件次第・不明）。
        // 値が欠けている・知らない値のときは灰（警告なし）に落とさず橙に寄せる。
        // 古い形のJSONを読んだときに、別途負担の注意が黙って消えるほうが危ない。
        const status = feature.guarantee_status;
        const cls = status === "separate" ? "feature-note warn"
          : status === "included" ? "feature-note"
          : "feature-note caution";
        lines.push(`<div class="${cls}">${escapeHtml(feature.guarantee_note)}</div>`);
      }
      if (feature.fee_note) {
        lines.push(`<div class="feature-note">${escapeHtml(feature.fee_note)}</div>`);
      }
      return lines.join("");
    }

    function sortedRows(rows) {
      const banks = bankOrder();
      const typeOrder = state.data.rate_type_order || [];
      return [...rows].sort((a, b) => {
        const bi = banks.indexOf(a.bank_id) - banks.indexOf(b.bank_id);
        if (bi !== 0) return bi;
        if (a.product_id !== b.product_id) return String(a.product_id).localeCompare(String(b.product_id));
        return typeOrder.indexOf(a.rate_type) - typeOrder.indexOf(b.rate_type);
      });
    }

    function visibleRows() {
      const q = state.search.trim().toLocaleLowerCase("ja");
      return state.data.rows.filter((row) => {
        if (state.selectedType && row.rate_type !== state.selectedType) return false;
        if (!state.selectedBanks.has(row.bank_id)) return false;
        if (!q) return true;
        return (
          String(row.bank_name ?? "").toLocaleLowerCase("ja").includes(q) ||
          String(row.product_name ?? "").toLocaleLowerCase("ja").includes(q)
        );
      });
    }

    function rateCell(entry, older, isCurrent, isBest) {
      const base = isCurrent ? "current" : "past";
      if (!entry) return `<td class="rate-cell ${base}"><span class="rate-empty">—</span></td>`;
      let dir = "";
      let arrow = "";
      if (older && isFiniteRate(entry.rate) && isFiniteRate(older.rate)) {
        if (entry.rate > older.rate) { dir = "up"; arrow = " <span class=\"arrow\">↑</span>"; }
        else if (entry.rate < older.rate) { dir = "down"; arrow = " <span class=\"arrow\">↓</span>"; }
      }
      const bestClass = isBest ? (isCurrent ? "best" : "past-best") : "";
      const cls = ["rate-cell", base, bestClass, dir].filter(Boolean).join(" ");
      const badge = isCurrent && isBest ? '<div class="best-badge">最安</div>' : "";
      const value = isCurrent
        ? `<div class="rate-val">${fmtRate(entry.rate)}${arrow}</div>`
        : `<span class="rate-val">${fmtRate(entry.rate)}${arrow}</span>`;
      return `<td class="${cls}">
        ${value}
        ${badge}
      </td>`;
    }

    function sameRate(a, b) {
      if (!a || !b || !isFiniteRate(a.rate) || !isFiniteRate(b.rate)) return false;
      return a.rate === b.rate;
    }

    function shortDate(date) {
      const m = /^\d{4}-(\d{2})-(\d{2})$/.exec(String(date ?? ""));
      return m ? `${m[1]}/${m[2]}` : String(date ?? "");
    }

    function buildColumns(rows, dates) {
      // 過去列のうち「1つ右（より古い列）と表示中の全行が同値」＝その週は誰も動いていない列を畳む。
      // 最新列と最古列は基準として必ず残す（最古を消すと比較の起点が無くなる）。
      const redundant = dates.map(() => false);
      for (let i = 1; i < dates.length - 1; i += 1) {
        redundant[i] = rows.every((row) => sameRate(entryAt(row, dates[i]), entryAt(row, dates[i + 1])));
      }
      const columns = [];
      for (let i = 0; i < dates.length; i += 1) {
        if (!redundant[i]) {
          columns.push({ kind: "date", date: dates[i], index: i });
          continue;
        }
        let last = i;
        while (last + 1 < dates.length && redundant[last + 1]) last += 1;
        columns.push({ kind: "nochange", from: dates[i], to: dates[last], count: last - i + 1 });
        i = last;
      }
      return columns;
    }

    function nochangeRange(col) {
      return col.count === 1 ? shortDate(col.from) : `${shortDate(col.from)}〜${shortDate(col.to)}`;
    }

    function minRateByDateAndType(rows, dates) {
      // 表示中の行から、各調査日×金利種別の最安値を求める。絞り込み後も毎回再計算する。
      const minimums = {};
      for (const date of dates) {
        minimums[date] = {};
        for (const row of rows) {
          const entry = entryAt(row, date);
          if (!entry || !isFiniteRate(entry.rate)) continue;
          const type = row.rate_type;
          const rate = entry.rate;
          if (!(type in minimums[date]) || rate < minimums[date][type]) {
            minimums[date][type] = rate;
          }
        }
      }
      return minimums;
    }

    function render() {
      const rows = sortedRows(visibleRows());
      if (!rows.length) {
        el.matrix.innerHTML = '<div class="empty-state"><strong>該当する金利がありません</strong>検索語・種別・機関の絞り込みを変えてください。</div>';
        return;
      }
      const dates = observationDates();
      if (!dates.length) {
        el.matrix.innerHTML = '<div class="empty-state"><strong>調査日データがありません</strong>金利履歴JSONをご確認ください。</div>';
        return;
      }
      const minimums = minRateByDateAndType(rows, dates);
      const columns = buildColumns(rows, dates);

      const thead = `<tr>
        <th class="col-bank">金融機関・商品${resizerHtml()}</th>
        <th class="col-type">種別</th>
        ${columns.map((col) => col.kind === "date"
          ? `<th class="col-date${col.index === 0 ? "" : " past"}">${fmtHeaderDate(col.date)}</th>`
          : `<th class="col-nochange" title="${escapeHtml(nochangeRange(col))} は表示中の全商品で金利変更なし"><span class="nochange-label">変更なし</span><span class="nochange-range">${escapeHtml(nochangeRange(col))}</span></th>`
        ).join("")}
        <th class="col-spacer" aria-hidden="true"></th>
      </tr>`;

      const body = rows.map((row, idx) => {
        const prev = rows[idx - 1];
        // 機関の変わり目（太い罫線を引く行）
        const isBankStart = Boolean(prev) && prev.bank_id !== row.bank_id;
        // 機関名セルは(機関×商品)単位で結合する。グループ先頭でのみ出力。
        const groupStart = !prev || prev.bank_id !== row.bank_id || prev.product_id !== row.product_id;

        const cells = columns.map((col) => {
          if (col.kind === "nochange") return '<td class="col-nochange"></td>';
          const i = col.index;
          const entry = entryAt(row, dates[i]);
          const older = i + 1 < dates.length ? entryAt(row, dates[i + 1]) : null;
          const isBest = Boolean(entry)
            && isFiniteRate(entry.rate)
            && entry.rate === minimums[col.date][row.rate_type];
          return rateCell(entry, older, i === 0, isBest);
        });

        let bankCell = "";
        if (groupStart) {
          let span = 1;
          for (let j = idx + 1; j < rows.length; j += 1) {
            if (rows[j].bank_id === row.bank_id && rows[j].product_id === row.product_id) span += 1;
            else break;
          }
          const url = row.url ? safeUrl(row.url) : "";
          const bankHtml = url
            ? `<a href="${url}" target="_blank" rel="noopener noreferrer">${escapeHtml(row.bank_name)}</a>`
            : escapeHtml(row.bank_name);
          // 保証料の上乗せがある機関だけ、機関名の下で断る（凡例だけでは行単位で伝わらない）
          const guaranteeHtml = row.guarantee_note
            ? `<div class="guarantee-note">※${escapeHtml(row.guarantee_note)}</div>`
            : "";
          bankCell = `<td class="col-bank" rowspan="${span}">
            <div class="bank-name">${bankHtml}</div>
            <div class="product-name">${escapeHtml(row.product_name || "")}</div>
            ${guaranteeHtml}
            ${featureNotesHtml(row)}
          </td>`;
        }

        return `<tr${isBankStart ? ' class="bank-start"' : ""}>
          ${bankCell}
          <td class="col-type"><span class="type-badge">${escapeHtml(typeLabel(row.rate_type))}</span></td>
          ${cells.join("")}
          <td class="col-spacer"></td>
        </tr>`;
      }).join("");

      el.matrix.innerHTML = `<table><thead>${thead}</thead><tbody>${body}</tbody></table>`;
      el.coverage.textContent = `${dates[dates.length - 1].replaceAll("-", "/")}〜${dates[0].replaceAll("-", "/")}（${dates.length}調査日）`;
      const sourceLabels = (state.data.data_sources || []).map((source) => source.description).filter(Boolean);
      el.sourceNote.textContent = sourceLabels.length ? `出典：${sourceLabels.join("、")}` : "";
    }

    function buildTypeChips() {
      const order = state.data.rate_type_order || [];
      state.selectedType = null;
      const chips = [`<button type="button" class="chip active" data-type="">すべて</button>`];
      for (const t of order) {
        chips.push(`<button type="button" class="chip" data-type="${escapeHtml(t)}">${escapeHtml(typeLabel(t))}</button>`);
      }
      el.typeChips.innerHTML = chips.join("");
    }

    function syncTypeChips() {
      el.typeChips.querySelectorAll("[data-type]").forEach((chip) => {
        chip.classList.toggle("active", (chip.dataset.type || null) === state.selectedType);
      });
    }

    function buildBankFilters() {
      const seen = new Map();
      // 金利データが1件も無い週でも種別ボタンと一緒に呼ばれるので、rows が無い形も受ける。
      for (const row of state.data.rows || []) {
        if (!seen.has(row.bank_id)) seen.set(row.bank_id, row.bank_name);
      }
      state.selectedBanks = new Set(seen.keys());
      el.bankFilters.innerHTML = [...seen.entries()].map(([id, name]) =>
        `<label class="filter-option"><input type="checkbox" value="${escapeHtml(id)}" checked> ${escapeHtml(name)}</label>`
      ).join("");
      updateFilterCount();
    }

    function updateFilterCount() {
      const total = new Set((state.data.rows || []).map((r) => r.bank_id)).size;
      el.filterCount.textContent = total ? `(${state.selectedBanks.size}/${total})` : "";
    }

    el.searchInput.addEventListener("input", () => { state.search = el.searchInput.value; render(); });

    el.typeChips.addEventListener("click", (event) => {
      const chip = event.target.closest("[data-type]");
      if (!chip) return;
      const type = chip.dataset.type || null;
      // 選んだ種別だけを表示する。選択中のものをもう一度押すと「すべて」に戻る
      state.selectedType = state.selectedType === type ? null : type;
      syncTypeChips();
      render();
    });

    el.filterButton.addEventListener("click", () => {
      const open = el.filterPopover.classList.toggle("open");
      el.filterButton.setAttribute("aria-expanded", String(open));
    });

    el.bankFilters.addEventListener("change", (event) => {
      if (event.target.type !== "checkbox") return;
      if (event.target.checked) state.selectedBanks.add(event.target.value);
      else state.selectedBanks.delete(event.target.value);
      updateFilterCount();
      render();
    });

    document.addEventListener("click", (event) => {
      if (!event.target.closest(".filter-menu")) {
        el.filterPopover.classList.remove("open");
        el.filterButton.setAttribute("aria-expanded", "false");
      }
    });

    // キーボード操作でも閉じられるようにする（閉じたらボタンへフォーカスを戻す）
    document.addEventListener("keydown", (event) => {
      if (event.key !== "Escape") return;
      if (!el.filterPopover.classList.contains("open")) return;
      el.filterPopover.classList.remove("open");
      el.filterButton.setAttribute("aria-expanded", "false");
      el.filterButton.focus();
    });

    // 商品条件（保証料・事務手数料）の読み込み。金利表の付随情報なので、
    // 失敗しても表そのものは出す（注記が消えるだけにする）。
    async function loadFeatures() {
      if (!DATASET.featuresUrl) return;
      try {
        const response = await fetch(DATASET.featuresUrl);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        for (const product of data.products || []) {
          if (product && product.product_id) state.features.set(product.product_id, product);
        }
      } catch (_e) {
        state.features.clear();
      }
    }

    async function initialize() {
      try {
        const response = await fetch(DATA_URL);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        state.data = await response.json();
        // 金利種別（変動・固定）の切替は rate_type_order だけで作れる。データが1件も無い週でも
        // 切替ボタンは出しておく（ボタンごと消えると「この商品には固定が無い」と誤読される）。
        buildTypeChips();
        buildBankFilters();
        if (!state.data.rows || !state.data.rows.length) {
          el.matrix.innerHTML = '<div class="empty-state"><strong>金利データがありません</strong>データが蓄積されると、ここに履歴が表示されます。</div>';
          return;
        }
        await loadFeatures();
        render();
      } catch (_e) {
        el.matrix.innerHTML = `<div class="empty-state"><strong>データを読み込めませんでした</strong>HTTPサーバー経由で開いているか、${escapeHtml(DATA_URL)} があるかご確認ください。</div>`;
      }
    }

    initialize();
  </script>
</body>
</html>
