<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="帯広エリアの金融機関新着情報を日付・機関別に閲覧するビューアー">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230b1f33'/><circle cx='16' cy='16' r='7' fill='%2355d6c9'/></svg>">
  <title>FinPulse News｜金融機関新着情報</title>
  <style>
    :root {
      --navy-950: #0b1f33;
      --navy-900: #102a43;
      --navy-800: #173e5e;
      --teal-700: #0d6e6e;
      --teal-600: #138484;
      --teal-100: #dff3f1;
      --gold-500: #d59b2b;
      --gold-100: #fff4d8;
      --ink: #172b3a;
      --muted: #647684;
      --line: #d9e2e8;
      --paper: #ffffff;
      --canvas: #f4f7f8;
      --danger-100: #fff0ee;
      --danger-700: #a54234;
      --shadow: 0 10px 30px rgba(11, 31, 51, 0.08);
      --radius: 14px;
      /* サイドバー幅の既定値。ドラッグで変更した値は .app-shell 側に直接書き込む。 */
      --sidebar-width: 292px;
    }

    * { box-sizing: border-box; }

    html { color-scheme: light; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: var(--canvas);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif;
      line-height: 1.32;
    }

    button, input { font: inherit; }

    button { color: inherit; }

    .mobile-tabs { display: none; }

    .app-shell {
      display: grid;
      grid-template-columns: var(--sidebar-width) 6px minmax(0, 1fr);
      min-height: 100vh;
    }

    /* 一覧ペインと記事ペインの境界。ドラッグ・矢印キーで幅を変えられる。 */
    .pane-resizer {
      position: sticky;
      top: 44px;
      height: calc(100vh - 44px);
      padding: 0;
      background: transparent;
      border: 0;
      border-right: 1px solid transparent;
      cursor: col-resize;
      touch-action: none;
    }

    .pane-resizer:hover,
    .pane-resizer.dragging { background: rgba(19, 132, 132, 0.28); }

    /* キーボード操作が唯一の非マウス手段なので、フォーカスは hover と別表現にする。
       背景色はハイコントラストで置き換わるため、枠線でも示す。 */
    .pane-resizer:focus-visible {
      background: rgba(19, 132, 132, 0.28);
      outline: 2px solid var(--teal-600);
      outline-offset: -2px;
    }

    @media (forced-colors: active) {
      .pane-resizer:focus-visible { outline: 2px solid Highlight; }
    }

    /* ドラッグ中はテキスト選択やiframeのhoverで操作が途切れないようにする */
    body.resizing { cursor: col-resize; user-select: none; }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      color: #eef7fa;
      background:
        radial-gradient(circle at 20% 0%, rgba(32, 144, 139, 0.27), transparent 32%),
        var(--navy-950);
      border-right: 1px solid rgba(255, 255, 255, 0.08);
    }

    /* サイトの見出し。検索ボックスの真上（トップバー内）に置く。 */
    .brand-mark {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 5px;
      color: var(--navy-950);
      font-size: 1.08rem;
      font-weight: 750;
      letter-spacing: 0.02em;
    }

    .pulse-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #55d6c9;
      box-shadow: 0 0 0 5px rgba(85, 214, 201, 0.15);
    }

    .nav-section { padding: 12px 14px 2px; }

    .nav-heading {
      margin: 0 10px 4px;
      color: #9db6c5;
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .nav-list {
      display: grid;
      gap: 3px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .nav-button {
      width: 100%;
      padding: 9px 12px;
      text-align: left;
      color: #d7e5ec;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 9px;
      cursor: pointer;
      transition: background 150ms ease, border-color 150ms ease, color 150ms ease;
    }

    .nav-button:hover { background: rgba(255, 255, 255, 0.07); }

    .nav-button.active {
      color: #ffffff;
      background: rgba(40, 158, 151, 0.2);
      border-color: rgba(85, 214, 201, 0.38);
    }

    #institutionList,
    #dateList { gap: 2px; }

    #institutionList .nav-button,
    #dateList .nav-button {
      padding: 3px 12px;
      border-radius: 7px;
      font-size: 0.8rem;
      line-height: 1.25;
    }

    #dateList .nav-button {
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .main { min-width: 0; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      padding: 7px clamp(20px, 4vw, 54px);
      background: rgba(244, 247, 248, 0.94);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(12px);
    }

    .topbar-inner {
      max-width: 1250px;
      margin: 0 auto;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .search-wrap { position: relative; flex: 1 1 300px; }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      color: var(--muted);
      transform: translateY(-50%);
      pointer-events: none;
    }

    #searchInput {
      width: 100%;
      padding: 6px 13px 6px 40px;
      color: var(--ink);
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 11px;
      outline: none;
      box-shadow: 0 2px 8px rgba(11, 31, 51, 0.03);
    }

    #searchInput:focus {
      border-color: var(--teal-600);
      box-shadow: 0 0 0 3px rgba(19, 132, 132, 0.13);
    }

    .filter-menu { position: relative; }

    .control-button,
    .toggle-label {
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      gap: 7px;
      padding: 5px 12px;
      white-space: nowrap;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 11px;
      cursor: pointer;
    }

    .control-button:hover, .toggle-label:hover { border-color: #a9bbc7; }

    .filter-popover {
      position: absolute;
      right: 0;
      top: calc(100% + 8px);
      z-index: 30;
      display: none;
      width: 260px;
      padding: 10px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: var(--shadow);
    }

    .filter-popover.open { display: block; }

    .filter-popover p {
      margin: 0 0 5px;
      color: var(--muted);
      font-size: 0.78rem;
    }

    .filter-option {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 4px 3px;
      cursor: pointer;
    }

    .filter-option input { accent-color: var(--teal-700); }

    .toggle-label input { accent-color: var(--teal-700); }

    .content {
      max-width: 1358px;
      margin: 0 auto;
      padding: 18px clamp(20px, 4vw, 54px) 32px;
    }

    .page-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .eyebrow {
      margin: 0 0 2px;
      color: var(--teal-700);
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.1em;
    }

    h1 {
      margin: 0;
      color: var(--navy-950);
      font-size: clamp(1.35rem, 2.2vw, 1.75rem);
      line-height: 1.15;
      letter-spacing: -0.025em;
    }

    .summary {
      margin: 0 0 1px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .summary.date-summary { white-space: nowrap; }

    .institution-section {
      margin-bottom: 9px;
      overflow: hidden;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 4px 18px rgba(11, 31, 51, 0.045);
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 14px;
      border-bottom: 1px solid var(--line);
    }

    .section-title {
      margin: 0;
      color: var(--navy-900);
      font-size: 0.98rem;
      line-height: 1.2;
    }

    .count {
      display: inline-flex;
      align-items: center;
      min-width: 34px;
      justify-content: center;
      padding: 2px 8px;
      color: var(--teal-700);
      background: var(--teal-100);
      border-radius: 999px;
      font-size: 0.76rem;
      font-weight: 700;
    }

    .table-wrap { width: 100%; }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    th, td {
      padding: 6px 14px;
      text-align: left;
      vertical-align: top;
      border-bottom: 1px solid #edf1f3;
    }

    th {
      color: var(--muted);
      background: #fbfcfc;
      font-size: 0.72rem;
      font-weight: 750;
      letter-spacing: 0.04em;
    }

    tbody tr:last-child td { border-bottom: 0; }

    tbody tr:hover td { background: #fbfdfd; }

    tbody td:first-child {
      color: var(--muted);
      font-size: 0.78rem;
      font-variant-numeric: tabular-nums;
      line-height: 1.25;
    }

    .date-column { width: 128px; }
    .report-column { width: 210px; }
    .keyword-column { width: 150px; }

    .article-link {
      color: var(--navy-800);
      font-weight: 650;
      text-decoration: none;
      overflow-wrap: anywhere;
    }

    .article-link:hover { color: var(--teal-700); text-decoration: underline; }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
      margin-top: 3px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 1px 6px;
      color: var(--muted);
      background: #edf2f4;
      border-radius: 999px;
      font-size: 0.68rem;
      font-weight: 700;
    }

    .badge.star { color: #79520c; background: var(--gold-100); }
    .badge.inferred { color: var(--teal-700); background: var(--teal-100); }
    .badge.excluded { color: var(--danger-700); background: var(--danger-100); }

    .star-row td:first-child { box-shadow: inset 3px 0 0 var(--gold-500); }

    .report-tags { display: flex; flex-wrap: nowrap; gap: 5px; }

    .report-tag {
      padding: 1px 6px;
      color: var(--navy-800);
      background: #edf2f4;
      border-radius: 6px;
      font-size: 0.7rem;
      white-space: nowrap;
    }

    mark {
      padding: 0 2px;
      color: inherit;
      background: #ffe59d;
      border-radius: 3px;
    }

    .excluded-block {
      margin: 6px 9px 9px;
      overflow: hidden;
      border: 1px solid #f0d5d0;
      border-radius: 10px;
    }

    .excluded-title {
      margin: 0;
      padding: 6px 10px;
      color: var(--danger-700);
      background: #fff8f7;
      font-size: 0.83rem;
      font-weight: 750;
    }

    .card-list { display: none; }

    .empty-state,
    .loading-state {
      padding: 38px 20px;
      text-align: center;
      color: var(--muted);
      background: var(--paper);
      border: 1px dashed #b9c8d1;
      border-radius: var(--radius);
    }

    .empty-state strong,
    .loading-state strong {
      display: block;
      margin-bottom: 5px;
      color: var(--navy-900);
      font-size: 1rem;
    }

    .hidden { display: none !important; }

    /* 製品タブ（新着ニュース / 金利調査レポート）とビュー切替 */
    .product-tabs {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      gap: 6px;
      height: 44px;
      padding: 0 16px;
      /* タブは縮めない方針のため、拡大表示ではみ出しても横スクロールを出さず切り取る */
      overflow: hidden;
      background: var(--navy-950);
      border-bottom: 1px solid rgba(255, 255, 255, 0.09);
    }

    .product-tab {
      flex: none;
      padding: 6px 14px;
      color: #c8d9e2;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.9rem;
    }

    .product-tab:hover { background: rgba(255, 255, 255, 0.07); }

    .product-tab.active {
      color: #ffffff;
      background: rgba(85, 214, 201, 0.18);
      border-color: rgba(85, 214, 201, 0.38);
    }

    /* サイト名・金利履歴の見出し・説明は、タブ行の右側に置く（画面の縦を使わない） */
    .tab-note {
      display: none;
      flex: 1 1 auto;
      min-width: 0;
      align-items: center;
      gap: 10px;
      margin: 0 0 0 6px;
      color: #a9c0ce;
      font-size: 0.8rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 縮み代が無いと省略記号が出ないため、自前の overflow を持たせる */
    .tab-note b {
      flex: 0 1 auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #eef7fa;
      font-weight: 750;
    }

    /* サイト名は縮めない（.tab-note b より詳細度を上げて上書きする） */
    .tab-note .tab-brand {
      display: inline-flex;
      flex: none;
      align-items: center;
      gap: 8px;
      overflow: visible;
      font-size: 0.95rem;
    }

    .tab-brand .pulse-dot { flex: none; }

    .tab-note span {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    body[data-view="rate"] .tab-note { display: flex; }

    /* 製品タブ44pxぶん全体を下げる */
    body { padding-top: 44px; }
    .sidebar { top: 44px; height: calc(100vh - 44px); }
    .topbar { top: 44px; }

    #rateView { display: none; }

    #rateFrame {
      display: block;
      width: 100%;
      height: calc(100vh - 44px);
      border: 0;
      background: #ffffff;
    }

    body[data-view="rate"] #newsView { display: none; }
    body[data-view="rate"] #rateView { display: block; }
    /* 金利レポート表示中はニュース用モバイルタブが無いので44pxのみ */
    body[data-view="rate"] { padding-top: 44px !important; }

    @media (max-width: 920px) {
      :root { --sidebar-width: 245px; }
      .controls { flex-wrap: wrap; }
      .search-wrap { flex-basis: 100%; }
      .tab-note { font-size: 0.76rem; }
    }

    @media (max-width: 700px) {
      body { padding-top: 98px; }

      /* PCは見出し右の1行表示。狭い画面では折り返さないと画面外へはみ出す */
      .summary.date-summary { white-space: normal; }

      .mobile-tabs {
        position: fixed;
        inset: 44px 0 auto 0;
        z-index: 100;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px;
        height: 54px;
        padding: 6px;
        background: var(--navy-950);
      }

      .mobile-tab {
        color: #c8d9e2;
        background: transparent;
        border: 0;
        border-radius: 8px;
        font-weight: 700;
      }

      .mobile-tab.active { color: #fff; background: rgba(85, 214, 201, 0.18); }

      .app-shell { display: block; min-height: calc(100vh - 98px); }

      /* 1画面1ペインのモバイルでは幅の調整は不要 */
      .pane-resizer { display: none; }

      .sidebar {
        position: static;
        width: 100%;
        height: auto;
        min-height: calc(100vh - 98px);
      }

      body[data-mobile-pane="content"] .sidebar { display: none; }
      body[data-mobile-pane="nav"] .main { display: none; }

      .nav-section { padding: 9px 12px 2px; }
      .brand-mark { font-size: 1rem; }

      /* タブ行が狭いので、サイト名と短い説明だけ残す */
      .tab-note .note-full,
      .tab-note .note-heading { display: none; }
      .tab-brand { font-size: 0.88rem; }

      .topbar { top: 98px; padding: 6px 10px; }
      .controls { gap: 5px; }
      .filter-menu, .toggle-label { flex: 1; }
      .control-button, .toggle-label { width: 100%; justify-content: center; font-size: 0.84rem; }
      .filter-popover { position: fixed; inset: 162px 14px auto 14px; width: auto; }

      .content { padding: 12px 10px 24px; }
      .page-head { align-items: end; gap: 6px; margin-bottom: 8px; }
      h1 { font-size: 1.3rem; }

      .institution-section { border-radius: 12px; }
      .section-head { align-items: center; padding: 7px 10px; }

      .table-wrap { display: none; }
      .card-list { display: grid; gap: 0; }

      .article-card {
        padding: 8px 10px;
        border-bottom: 1px solid #edf1f3;
      }

      .article-card:last-child { border-bottom: 0; }
      .article-card.star-card { border-left: 3px solid var(--gold-500); }

      .card-date {
        margin: 0 0 2px;
        color: var(--muted);
        font-size: 0.68rem;
        line-height: 1.2;
        font-variant-numeric: tabular-nums;
      }

      .card-meta { margin-top: 4px; }
      .excluded-block { margin: 6px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body data-mobile-pane="nav" data-view="news">
  <nav class="product-tabs" aria-label="表示するレポートの切替">
    <button class="product-tab active" type="button" data-view="news">新着ニュース</button>
    <button class="product-tab" type="button" data-view="rate">金利履歴</button>
    <p class="tab-note"><b class="tab-brand"><span class="pulse-dot" aria-hidden="true"></span>十勝金融機関News</b><b class="note-heading">金利履歴ビューアー</b><span><span class="note-full">帯広エリア 金融機関の住宅ローン金利を、共通の調査日で比較できます。</span>左が最新、右が過去です。</span></p>
  </nav>

  <div id="newsView">
  <nav class="mobile-tabs" aria-label="スマートフォン表示切替">
    <button class="mobile-tab active" type="button" data-pane="nav">一覧</button>
    <button class="mobile-tab" type="button" data-pane="content">記事</button>
  </nav>

  <div class="app-shell">
    <aside class="sidebar" aria-label="レポート選択">
      <section class="nav-section">
        <h2 class="nav-heading">🏦 機関で見る</h2>
        <ul class="nav-list" id="institutionList"><li class="nav-button">読み込み中…</li></ul>
      </section>

      <section class="nav-section">
        <h2 class="nav-heading">📅 日付で見る</h2>
        <ul class="nav-list" id="dateList"><li class="nav-button">読み込み中…</li></ul>
      </section>
    </aside>

    <div class="pane-resizer" id="paneResizer" role="separator" aria-orientation="vertical"
         aria-label="一覧ペインの幅を調整" tabindex="0"></div>

    <main class="main">
      <header class="topbar">
        <div class="topbar-inner">
        <div class="brand-mark"><span class="pulse-dot" aria-hidden="true"></span>十勝金融機関News</div>
        <div class="controls">
          <label class="search-wrap">
            <span class="search-icon" aria-hidden="true">⌕</span>
            <span class="hidden">タイトルを検索</span>
            <input id="searchInput" type="search" placeholder="記事タイトルを検索" aria-label="記事タイトルを検索" autocomplete="off">
          </label>

          <div class="filter-menu" id="institutionFilterWrap">
            <button class="control-button" id="filterButton" type="button" aria-expanded="false" aria-controls="filterPopover">
              機関を絞り込む <span id="filterCount"></span>
            </button>
            <div class="filter-popover" id="filterPopover">
              <p>表示する金融機関</p>
              <div id="institutionFilters"></div>
            </div>
          </div>

          <label class="toggle-label" id="excludedToggleWrap">
            <input id="excludedToggle" type="checkbox">
            除外も表示
          </label>
        </div>
        </div>
      </header>

      <div class="content">
        <div class="page-head">
          <div>
            <p class="eyebrow" id="modeLabel">REPORT VIEWER</p>
            <h1 id="pageTitle">レポートを読み込んでいます</h1>
          </div>
          <p class="summary" id="pageSummary"></p>
        </div>
        <div id="reportContent" aria-live="polite">
          <div class="loading-state"><strong>データを読み込んでいます</strong>しばらくお待ちください。</div>
        </div>
      </div>
    </main>
  </div>
  </div><!-- /newsView -->

  <div id="rateView">
    <iframe id="rateFrame" title="金利履歴" loading="lazy"></iframe>
  </div>

  <script>
    "use strict";

    const DATA_ROOT = "../output/data";
    const state = {
      mode: "date",
      selectedDate: "",
      selectedInstitution: "",
      report: null,
      manifest: { reports: [] },
      institutionIndex: { institutions: [] },
      reportRequestId: 0,
      selectedInstitutions: new Set(),
      search: "",
      showExcluded: false,
    };

    const elements = {
      dateList: document.getElementById("dateList"),
      institutionList: document.getElementById("institutionList"),
      institutionFilters: document.getElementById("institutionFilters"),
      institutionFilterWrap: document.getElementById("institutionFilterWrap"),
      filterButton: document.getElementById("filterButton"),
      filterPopover: document.getElementById("filterPopover"),
      filterCount: document.getElementById("filterCount"),
      excludedToggleWrap: document.getElementById("excludedToggleWrap"),
      excludedToggle: document.getElementById("excludedToggle"),
      searchInput: document.getElementById("searchInput"),
      modeLabel: document.getElementById("modeLabel"),
      pageTitle: document.getElementById("pageTitle"),
      pageSummary: document.getElementById("pageSummary"),
      reportContent: document.getElementById("reportContent"),
    };

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>'"]/g, (char) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;"
      })[char]);
    }

    function safeUrl(value) {
      try {
        const url = new URL(value);
        return ["http:", "https:"].includes(url.protocol) ? escapeHtml(url.href) : "#";
      } catch (_error) {
        return "#";
      }
    }

    function highlight(text) {
      const value = String(text ?? "");
      const query = state.search.trim();
      if (!query) return escapeHtml(value);
      const lowerValue = value.toLocaleLowerCase("ja");
      const lowerQuery = query.toLocaleLowerCase("ja");
      let cursor = 0;
      let output = "";
      let index = lowerValue.indexOf(lowerQuery);
      while (index !== -1) {
        output += escapeHtml(value.slice(cursor, index));
        output += `<mark>${escapeHtml(value.slice(index, index + query.length))}</mark>`;
        cursor = index + query.length;
        index = lowerValue.indexOf(lowerQuery, cursor);
      }
      return output + escapeHtml(value.slice(cursor));
    }

    function matchesSearch(item) {
      return !state.search.trim() || String(item.title ?? "").toLocaleLowerCase("ja").includes(state.search.trim().toLocaleLowerCase("ja"));
    }

    function formatReportPeriod(reports) {
      const dates = [...new Set((reports || []).filter(Boolean))].sort();
      if (!dates.length) return "—";
      if (dates.length === 1) return dates[0];
      return `${dates[0]}～${dates[dates.length - 1]}`;
    }

    function formatDate(date) {
      if (!date) return "日付不明";
      const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(date);
      return match ? `${match[1]}年${Number(match[2])}月${Number(match[3])}日` : date;
    }

    function badges(item) {
      const list = [];
      if (item.star) list.push('<span class="badge star">★ 金利・キャンペーン</span>');
      if (item.fallback) list.push('<span class="badge">期間外の最新記事</span>');
      if (item.date_inferred) list.push('<span class="badge inferred">日付を当月初で補完</span>');
      return list.length ? `<div class="badges">${list.join("")}</div>` : "";
    }

    function articleTable(items, options = {}) {
      const showReports = Boolean(options.showReports);
      const rows = items.map((item) => `
        <tr class="${item.star ? "star-row" : ""}">
          <td>${escapeHtml(item.date || "—")}</td>
          <td><a class="article-link" href="${safeUrl(item.url)}" target="_blank" rel="noopener noreferrer">${highlight(item.title)}</a>${badges(item)}</td>
          ${showReports ? `<td><div class="report-tags"><span class="report-tag">${escapeHtml(formatReportPeriod(item.reports))}</span></div></td>` : ""}
        </tr>`).join("");
      const cards = items.map((item) => `
        <article class="article-card ${item.star ? "star-card" : ""}">
          <p class="card-date">${escapeHtml(formatDate(item.date))}</p>
          <a class="article-link" href="${safeUrl(item.url)}" target="_blank" rel="noopener noreferrer">${highlight(item.title)}</a>
          ${badges(item)}
          ${showReports ? `<div class="card-meta"><div class="report-tags"><span class="report-tag">収録期間 ${escapeHtml(formatReportPeriod(item.reports))}</span></div></div>` : ""}
        </article>`).join("");
      return `
        <div class="table-wrap">
          <table>
            <thead><tr><th class="date-column">日付</th><th>タイトル</th>${showReports ? '<th class="report-column">収録期間</th>' : ""}</tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
        <div class="card-list">${cards}</div>`;
    }

    function excludedTable(items) {
      const rows = items.map((item) => `
        <tr><td>${escapeHtml(item.date || "—")}</td><td>${highlight(item.title)}</td><td>${escapeHtml(item.exclude_keyword || "—")}</td></tr>`).join("");
      const cards = items.map((item) => `
        <article class="article-card">
          <p class="card-date">${escapeHtml(formatDate(item.date))}</p>
          <div>${highlight(item.title)}</div>
          <div class="badges"><span class="badge excluded">除外理由: ${escapeHtml(item.exclude_keyword || "未指定")}</span></div>
        </article>`).join("");
      return `
        <div class="excluded-block">
          <p class="excluded-title">除外された情報（${items.length}件）</p>
          <div class="table-wrap"><table><thead><tr><th class="date-column">日付</th><th>タイトル</th><th class="keyword-column">除外キーワード</th></tr></thead><tbody>${rows}</tbody></table></div>
          <div class="card-list">${cards}</div>
        </div>`;
    }

    function emptyState(title, message) {
      return `<div class="empty-state"><strong>${escapeHtml(title)}</strong>${escapeHtml(message)}</div>`;
    }

    function passedEmptyMessage(excludedCount) {
      // 除外トグルの状態と除外件数に合わせ、実際に表示されている内容と矛盾しない文言を返す
      if (!excludedCount) return "対象期間内の記事はありません。";
      if (state.showExcluded) return "除外情報のみ表示しています。";
      return "除外された記事は「除外も表示」で確認できます。";
    }

    function renderDateMode() {
      const report = state.report;
      if (!report) return;
      const sections = [];
      let passedCount = 0;
      let excludedCount = 0;

      for (const institution of report.institutions || []) {
        if (!state.selectedInstitutions.has(institution.name)) continue;
        const passed = (institution.passed || []).filter(matchesSearch);
        const excluded = (institution.excluded || []).filter(matchesSearch);
        if (state.search.trim() && !passed.length && !(state.showExcluded && excluded.length)) continue;
        passedCount += passed.length;
        excludedCount += state.showExcluded ? excluded.length : 0;
        sections.push(`
          <section class="institution-section">
            <div class="section-head">
              <h2 class="section-title">${escapeHtml(institution.name)}</h2>
              <span class="count">${passed.length}件</span>
            </div>
            ${passed.length ? articleTable(passed) : emptyState("通過記事はありません", passedEmptyMessage(excluded.length))}
            ${state.showExcluded && excluded.length ? excludedTable(excluded) : ""}
          </section>`);
      }

      elements.modeLabel.textContent = "DATE REPORT";
      elements.pageTitle.textContent = formatDate(report.date);
      const period = report.lookback_days ? `対象期間 過去${report.lookback_days}日` : "対象期間 全件";
      elements.pageSummary.classList.add("date-summary");
      elements.pageSummary.textContent = `${period}　通過 ${passedCount}件${state.showExcluded ? `　除外 ${excludedCount}件` : ""}`;
      elements.reportContent.innerHTML = sections.length ? sections.join("") : emptyState("該当する記事がありません", "検索語または機関の絞り込みを変更してください。 ");
    }

    function renderInstitutionMode() {
      const institution = (state.institutionIndex.institutions || []).find((item) => item.name === state.selectedInstitution);
      const items = (institution?.items || []).filter(matchesSearch);
      elements.modeLabel.textContent = "INSTITUTION ARCHIVE";
      elements.pageTitle.textContent = state.selectedInstitution || "金融機関を選択";
      elements.pageSummary.classList.remove("date-summary");
      elements.pageSummary.textContent = `全レポート横断・重複除去済み・${items.length}件`;
      elements.reportContent.innerHTML = items.length
        ? `<section class="institution-section">${articleTable(items, { showReports: true })}</section>`
        : emptyState("該当する記事がありません", "別の機関または検索語をお試しください。");
    }

    function render() {
      const isDateMode = state.mode === "date";
      elements.institutionFilterWrap.classList.toggle("hidden", !isDateMode);
      elements.excludedToggleWrap.classList.toggle("hidden", !isDateMode);
      renderNavigation();
      if (isDateMode) renderDateMode(); else renderInstitutionMode();
    }

    function renderNavigation() {
      elements.dateList.innerHTML = state.manifest.reports.map((date) => `
        <li><button type="button" class="nav-button ${state.mode === "date" && state.selectedDate === date ? "active" : ""}" data-date="${escapeHtml(date)}">${escapeHtml(formatDate(date))}</button></li>`).join("");
      elements.institutionList.innerHTML = state.institutionIndex.institutions.map((institution) => `
        <li><button type="button" class="nav-button ${state.mode === "institution" && state.selectedInstitution === institution.name ? "active" : ""}" data-institution="${escapeHtml(institution.name)}">${escapeHtml(institution.name)}</button></li>`).join("");
    }

    function buildInstitutionFilters(institutions) {
      // 日付切替時も前回の絞り込みを引き継ぐ（新レポートに存在する機関との積集合）。
      // 初回表示や、引き継げる機関が1つも残らない場合は全選択に戻す。
      const names = institutions.map((item) => item.name);
      const kept = names.filter((name) => state.selectedInstitutions.has(name));
      state.selectedInstitutions = new Set(kept.length ? kept : names);
      elements.institutionFilters.innerHTML = institutions.map((institution) => `
        <label class="filter-option"><input type="checkbox" value="${escapeHtml(institution.name)}" ${state.selectedInstitutions.has(institution.name) ? "checked" : ""}> ${escapeHtml(institution.name)}</label>`).join("");
      updateFilterCount();
    }

    function updateFilterCount() {
      const total = state.report?.institutions?.length || 0;
      elements.filterCount.textContent = total ? `(${state.selectedInstitutions.size}/${total})` : "";
    }

    async function loadReport(date) {
      const requestId = ++state.reportRequestId;
      state.mode = "date";
      state.selectedDate = date;
      syncHash();
      elements.reportContent.innerHTML = '<div class="loading-state"><strong>レポートを読み込んでいます</strong>しばらくお待ちください。</div>';
      try {
        const response = await fetch(`${DATA_ROOT}/${date}.json`);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const report = await response.json();
        if (requestId !== state.reportRequestId) return;
        state.report = report;
        buildInstitutionFilters(state.report.institutions || []);
        render();
        showMobilePane("content");
      } catch (_error) {
        if (requestId !== state.reportRequestId) return;
        state.report = null;
        elements.pageTitle.textContent = formatDate(date);
        elements.pageSummary.textContent = "";
        elements.reportContent.innerHTML = emptyState("データを読み込めませんでした", "少し時間を置いてから再度お試しください。");
      }
    }

    function selectInstitution(name) {
      state.reportRequestId += 1;
      state.mode = "institution";
      state.selectedInstitution = name;
      elements.filterPopover.classList.remove("open");
      elements.filterButton.setAttribute("aria-expanded", "false");
      syncHash();
      render();
      showMobilePane("content");
    }

    function showMobilePane(pane) {
      document.body.dataset.mobilePane = pane;
      document.querySelectorAll(".mobile-tab").forEach((button) => {
        button.classList.toggle("active", button.dataset.pane === pane);
      });
    }

    // 復元用の初期ハッシュ。初期化の途中で syncHash に上書きされるため、起動時に控えておく。
    const INITIAL_HASH = location.hash;

    // 表示中のタブと選択内容をURLへ書き戻す。リロードやブックマークで同じ画面に戻れる。
    // 履歴は増やさない（replaceState）。戻るボタンは従来どおりサイト外へ戻る。
    function syncHash() {
      let hash = "";
      if (document.body.dataset.view === "rate") {
        hash = "#rate";
      } else if (state.mode === "institution" && state.selectedInstitution) {
        hash = `#inst/${encodeURIComponent(state.selectedInstitution)}`;
      } else if (state.mode === "date" && state.selectedDate) {
        hash = `#date/${state.selectedDate}`;
      }
      if (hash && hash !== location.hash) {
        history.replaceState(null, "", hash);
      }
    }

    /** URLのハッシュを解釈する。読み取れない場合は null を返し、呼び出し側の既定動作へ委ねる。 */
    function parseHash(raw = location.hash) {
      if (raw === "#rate") return { view: "rate" };
      const dateMatch = raw.match(/^#date\/(\d{4}-\d{2}-\d{2})$/);
      if (dateMatch) return { view: "news", date: dateMatch[1] };
      const instMatch = raw.match(/^#inst\/(.+)$/);
      if (instMatch) {
        try {
          return { view: "news", institution: decodeURIComponent(instMatch[1]) };
        } catch (_error) {
          return null;  // 壊れたパーセントエンコードは無視する
        }
      }
      return null;
    }

    async function initialize() {
      async function fetchJson(path) {
        const response = await fetch(path);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return response.json();
      }

      const [manifestResult, institutionResult] = await Promise.allSettled([
        fetchJson(`${DATA_ROOT}/index.json`),
        fetchJson(`${DATA_ROOT}/by-institution.json`),
      ]);

      if (manifestResult.status === "fulfilled" && Array.isArray(manifestResult.value?.reports)) {
        state.manifest = manifestResult.value;
      }
      if (institutionResult.status === "fulfilled" && Array.isArray(institutionResult.value?.institutions)) {
        state.institutionIndex = institutionResult.value;
      }

      renderNavigation();

      // URLで指定された選択を復元する。存在しない日付・機関名は既定動作へ落とす。
      const requested = parseHash(INITIAL_HASH);
      const wantsDate = requested?.date && state.manifest.reports.includes(requested.date);
      const wantsInstitution = requested?.institution
        && state.institutionIndex.institutions.some((item) => item.name === requested.institution);

      if (wantsInstitution) {
        selectInstitution(requested.institution);
      } else if (wantsDate) {
        await loadReport(requested.date);
      } else if (state.manifest.reports.length) {
        await loadReport(state.manifest.reports[0]);
      } else if (state.institutionIndex.institutions.length) {
        selectInstitution(state.institutionIndex.institutions[0].name);
      } else if (manifestResult.status === "fulfilled" || institutionResult.status === "fulfilled") {
        elements.pageTitle.textContent = "レポートがありません";
        elements.pageSummary.textContent = "";
        elements.reportContent.innerHTML = emptyState("データがありません", "レポートが生成されると、ここに表示されます。");
      } else {
        elements.dateList.innerHTML = "";
        elements.institutionList.innerHTML = "";
        elements.pageTitle.textContent = "データを読み込めませんでした";
        elements.pageSummary.textContent = "";
        elements.reportContent.innerHTML = emptyState("ヴューアーを開始できません", "HTTPサーバー経由で開いているか、データファイルがあるかをご確認ください。");
      }
    }

    elements.dateList.addEventListener("click", (event) => {
      const button = event.target.closest("[data-date]");
      if (button) loadReport(button.dataset.date);
    });

    elements.institutionList.addEventListener("click", (event) => {
      const button = event.target.closest("[data-institution]");
      if (button) selectInstitution(button.dataset.institution);
    });

    elements.searchInput.addEventListener("input", () => {
      state.search = elements.searchInput.value;
      render();
    });

    elements.excludedToggle.addEventListener("change", () => {
      state.showExcluded = elements.excludedToggle.checked;
      renderDateMode();
    });

    elements.filterButton.addEventListener("click", () => {
      const isOpen = elements.filterPopover.classList.toggle("open");
      elements.filterButton.setAttribute("aria-expanded", String(isOpen));
    });

    elements.institutionFilters.addEventListener("change", (event) => {
      if (event.target.type !== "checkbox") return;
      if (event.target.checked) state.selectedInstitutions.add(event.target.value);
      else state.selectedInstitutions.delete(event.target.value);
      updateFilterCount();
      renderDateMode();
    });

    document.addEventListener("click", (event) => {
      if (!event.target.closest(".filter-menu")) {
        elements.filterPopover.classList.remove("open");
        elements.filterButton.setAttribute("aria-expanded", "false");
      }
    });

    // キーボード操作でも閉じられるようにする（閉じたらボタンへフォーカスを戻す）
    document.addEventListener("keydown", (event) => {
      if (event.key !== "Escape") return;
      if (!elements.filterPopover.classList.contains("open")) return;
      elements.filterPopover.classList.remove("open");
      elements.filterButton.setAttribute("aria-expanded", "false");
      elements.filterButton.focus();
    });

    document.querySelectorAll(".mobile-tab").forEach((button) => {
      button.addEventListener("click", () => showMobilePane(button.dataset.pane));
    });

    // 一覧ペイン（左）と記事ペイン（右）の幅調整。ドラッグと矢印キーに対応し、
    // 決めた幅は localStorage に残す。ダブルクリックで既定幅へ戻す。
    const SIDEBAR_WIDTH_KEY = "finpulse.sidebarWidth";
    const SIDEBAR_MIN = 180;
    const SIDEBAR_MAX = 620;
    const appShell = document.querySelector(".app-shell");
    const paneResizer = document.getElementById("paneResizer");
    // ユーザーが決めた幅そのもの。表示上はウィンドウ幅で切り詰めるが、
    // 窓を広げれば元の希望幅へ戻せるよう、切り詰め前の値をここに保つ。
    let preferredWidth = null;

    function applySidebarWidth(width) {
      // 画面が狭いときに右ペインが潰れないよう、上限は表示幅にも従わせる
      const limit = Math.min(SIDEBAR_MAX, Math.max(SIDEBAR_MIN, window.innerWidth - 320));
      const value = Math.round(Math.min(limit, Math.max(SIDEBAR_MIN, width)));
      appShell.style.setProperty("--sidebar-width", `${value}px`);
      return value;
    }

    function storeSidebarWidth(width) {
      try {
        localStorage.setItem(SIDEBAR_WIDTH_KEY, String(width));
      } catch (_error) {
        // プライベートモード等で保存できなくても、その場の幅調整は使える
      }
    }

    function resetSidebarWidth() {
      appShell.style.removeProperty("--sidebar-width");
      preferredWidth = null;
      try {
        localStorage.removeItem(SIDEBAR_WIDTH_KEY);
      } catch (_error) { /* 保存できない環境では何もしない */ }
    }

    (function restoreSidebarWidth() {
      let saved = null;
      try {
        saved = localStorage.getItem(SIDEBAR_WIDTH_KEY);
      } catch (_error) { /* 読めなければ既定幅のまま */ }
      const width = Number(saved);
      if (Number.isFinite(width) && width > 0) {
        preferredWidth = width;
        applySidebarWidth(width);
      }
    })();

    // ウィンドウを縮めたときに右ペインが潰れないよう、希望幅を上限で切り詰め直す。
    // 保存値は書き換えないので、窓を広げれば元の幅へ戻る。
    // 700px以下は1画面1ペイン（.app-shell が block）なので何もしない。
    window.addEventListener("resize", () => {
      if (preferredWidth === null) return;
      if (window.innerWidth <= 700) return;
      applySidebarWidth(preferredWidth);
    });

    paneResizer.addEventListener("pointerdown", (event) => {
      if (event.button !== 0) return;
      // 既定動作を止めるとフォーカス移動も止まるため、矢印キー操作のために明示的に当てる
      event.preventDefault();
      paneResizer.focus();
      paneResizer.setPointerCapture(event.pointerId);
      paneResizer.classList.add("dragging");
      document.body.classList.add("resizing");
    });

    paneResizer.addEventListener("pointermove", (event) => {
      if (!paneResizer.hasPointerCapture(event.pointerId)) return;
      preferredWidth = applySidebarWidth(event.clientX - appShell.getBoundingClientRect().left);
    });

    // ドラッグ表示の後始末だけを行う（何度呼んでも安全）。
    function cleanupResize() {
      paneResizer.classList.remove("dragging");
      document.body.classList.remove("resizing");
    }

    function endResize(event) {
      if (!paneResizer.hasPointerCapture(event.pointerId)) return;
      paneResizer.releasePointerCapture(event.pointerId);
      cleanupResize();
      const current = parseInt(appShell.style.getPropertyValue("--sidebar-width"), 10);
      if (Number.isFinite(current)) storeSidebarWidth(current);
    }

    paneResizer.addEventListener("pointerup", endResize);
    paneResizer.addEventListener("pointercancel", endResize);
    // 要素が消える等でキャプチャが暗黙解放されると pointerup が届かない。
    // body.resizing（全面 user-select:none）が残らないよう、ここでも必ず後始末する。
    paneResizer.addEventListener("lostpointercapture", cleanupResize);

    paneResizer.addEventListener("dblclick", resetSidebarWidth);

    paneResizer.addEventListener("keydown", (event) => {
      const step = event.shiftKey ? 40 : 12;
      let delta = 0;
      if (event.key === "ArrowLeft") delta = -step;
      else if (event.key === "ArrowRight") delta = step;
      else if (event.key === "Home") { resetSidebarWidth(); event.preventDefault(); return; }
      else return;
      event.preventDefault();
      preferredWidth = applySidebarWidth(appShell.querySelector(".sidebar").getBoundingClientRect().width + delta);
      storeSidebarWidth(preferredWidth);
    });

    const RATE_REPORT_SRC = "./rate-history.html";
    const NEWS_TITLE = "FinPulse News｜金融機関新着情報";
    const RATE_TITLE = "FinPulse News｜金利履歴";
    let rateLoaded = false;

    function switchView(view) {
      document.body.dataset.view = view;
      document.querySelectorAll(".product-tab").forEach((button) => {
        button.classList.toggle("active", button.dataset.view === view);
      });
      // 金利履歴は初回表示時にだけ読み込む（初期表示を軽くする）
      if (view === "rate" && !rateLoaded) {
        document.getElementById("rateFrame").src = RATE_REPORT_SRC;
        rateLoaded = true;
      }
      document.title = view === "rate" ? RATE_TITLE : NEWS_TITLE;
      syncHash();
    }

    document.querySelectorAll(".product-tab").forEach((button) => {
      button.addEventListener("click", () => switchView(button.dataset.view));
    });

    // アドレスバーのハッシュを手で書き換えた場合（ページは再読み込みされない）にも追従する。
    // 自分の syncHash による書き換えは replaceState のため、このイベントは発火しない。
    window.addEventListener("hashchange", () => {
      const requested = parseHash();
      if (!requested) return;
      if (requested.view === "rate") {
        switchView("rate");
        return;
      }
      if (document.body.dataset.view !== "news") switchView("news");
      if (requested.institution
        && state.institutionIndex.institutions.some((item) => item.name === requested.institution)) {
        selectInstitution(requested.institution);
      } else if (requested.date && state.manifest.reports.includes(requested.date)) {
        loadReport(requested.date);
      }
    });

    // ニュース側の復元を終えてからタブを切り替える（金利タブのiframe遅延読み込みを保つ）
    initialize().then(() => {
      if (parseHash(INITIAL_HASH)?.view === "rate") switchView("rate");
    });
  </script>
</body>
</html>
