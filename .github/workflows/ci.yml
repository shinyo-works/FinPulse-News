name: CI

# PR と main への push で、全テストと依存の脆弱性検査を回す（2026-10-19 本人指示）。
#
# 目的は「変更で既存の動きが壊れていないか」を PR の画面に緑／赤で残すことと、
# マージの関所（~/.claude/scripts/safe-merge.sh）が見る CI のチェックを用意すること。
# secrets は渡さない（テストはメール送信も外部への接続もしない）。公開リポジトリなので、
# フォークからの PR でも安全なよう contents: read だけにし、git に書き戻すステップも持たない。
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# 同じ PR に push が重なったら古い実行を止める（データを書く job ではないので途中で止めてよい）。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Python環境セットアップ
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: 固定した依存パッケージをインストール
        run: python -m pip install --require-hashes -r requirements.lock

      - name: 自動テスト
        env:
          # 金利履歴と条件比較の商品突合は、上流の商品増減（main への自動コミット）だけで落ち、
          # コードと関係なく PR を赤にするので、週次と同じく外す。ローカルと pre-commit では走る。
          FINPULSE_DEFER_DATA_SYNC_TESTS: '1'
        run: python -m unittest discover -s tests -v

  # 依存の既知脆弱性（セキュリティ検査）。test とは独立に走らせ、どちらが赤かを一目で分かるようにする。
  # ロックファイルのハッシュどおりに解決し（--require-hashes）、手元の pip には頼らない（--disable-pip）。
  # 手元で同じ結果を見るコマンド: pip-audit -r requirements.lock --require-hashes --disable-pip
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Python環境セットアップ
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: 検査ツールをインストール
        run: python -m pip install pip-audit==2.9.0

      - name: 依存の既知脆弱性を検査
        run: pip-audit -r requirements.lock --require-hashes --disable-pip --progress-spinner off
