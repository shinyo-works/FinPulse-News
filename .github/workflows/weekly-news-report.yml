name: 週次金融機関新着情報レポート

on:
  # 本命は外部スケジューラ（cron-job.org）から毎週月曜 08:05 JST と毎月1日 09:20 JST に workflow_dispatch で起動する
  # （GitHub の schedule は1〜3時間遅れるため。手順は docs/external-scheduler.md）。
  # 下の schedule は外部が止まった回の控え。guard ジョブが「今日すでに成功済み」なら省略するので、
  # 1日が月曜に重なった日も1回だけになる。
  schedule:
    - cron: '0 0 * * 1'  # 控え: 毎週月曜 00:00 UTC = 月曜 09:00 JST
    - cron: '30 1 1 * *'  # 控え: 毎月1日 01:30 UTC = 1日 10:30 JST（金利の月初改定に合わせる）
  workflow_dispatch:       # 外部スケジューラと手動実行ボタン
    inputs:
      force:
        description: '今日すでに成功した実行があっても、もう一度実行する（手動のやり直し用）'
        type: boolean
        default: false
      check_only:
        description: '起動の確認だけして、収集・送信・公開はしない（外部スケジューラの接続テスト用）'
        type: boolean
        default: false

concurrency:
  group: weekly-news-report-main
  cancel-in-progress: false

jobs:
  # 同時実行は上の concurrency で1本ずつに並ぶので、後から来た実行は前の実行が
  # 公開まで終わってから判定する（本命と控えが両方動いても取りこぼさない）。
  guard:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main
          sparse-checkout: scripts/check_weekly_run.py
          sparse-checkout-cone-mode: false

      - name: 今回実行するかを判定
        id: decide
        continue-on-error: true
        timeout-minutes: 2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INPUT_FORCE: ${{ inputs.force }}
          INPUT_CHECK_ONLY: ${{ inputs.check_only }}
        run: python3 scripts/check_weekly_run.py

  # 金利調査ツール（毎週月曜 07:00・毎月1日 09:00）が置いた公開用の金利データを取り込む。
  # ニュースの判定（guard）とは独立に動く。取り込み済みの調査日なら何もしないので、何度動いても安全。
  # 接続テスト（check_only）では動かさない。中身は import-rate-history.yml。
  import-rate-history:
    if: >-
      github.ref == 'refs/heads/main' &&
      format('{0}', inputs.check_only) != 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/import-rate-history.yml
    secrets:
      RATE_FEED_READ_KEY: ${{ secrets.RATE_FEED_READ_KEY }}
      RATE_FEED_REPOSITORY: ${{ secrets.RATE_FEED_REPOSITORY }}

  collect-and-report:
    needs: guard
    # 判定が「実行しない」と明示した時だけ止める。判定ジョブの失敗・出力なしは実行する側に倒す。
    # ただし接続テスト（check_only）は判定の成否に関係なく、ここでも止める（本物のメールを送らない）。
    # 値が真偽値でも文字列 "true" でも止まるよう、文字列にそろえて比べる。
    if: >-
      !cancelled() &&
      github.ref == 'refs/heads/main' &&
      format('{0}', inputs.check_only) != 'true' &&
      needs.guard.outputs.should_run != 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main

      - name: Python環境セットアップ
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: 固定した依存パッケージをインストール
        run: python -m pip install --require-hashes -r requirements.lock

      - name: 自動テスト
        env:
          # 金利履歴と条件比較の商品突合は、上流の商品増減で落ちてもニュース配信を
          # 止めないよう、収集後の警告ステップへ回す。
          FINPULSE_DEFER_DATA_SYNC_TESTS: '1'
        run: python -m unittest discover -s tests -v

      - name: 収集・レポート生成・送信
        id: collect
        continue-on-error: true
        timeout-minutes: 15
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
        run: python scripts/collect_and_send.py

      - name: 条件比較データと金利履歴の突合（失敗しても配信は止めない）
        if: always()
        continue-on-error: true
        run: |
          python -m unittest tests.test_loan_features -v || {
            echo "::warning::金利履歴と条件比較データ（docs/data/loan-features.json）の商品が一致しません。上流で商品が増減した可能性があります。"
            exit 1
          }

      - name: 生成した成果物を一時保存
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: weekly-news-output
          path: output/
          if-no-files-found: error
          retention-days: 1

      - name: 収集結果をActionsの成否に反映
        if: always() && steps.collect.outcome == 'failure'
        run: |
          echo "一部の金融機関の収集、JSON生成、またはメール送信に失敗しました。"
          exit 1

  publish-results:
    needs: collect-and-report
    if: >-
      always() &&
      (needs.collect-and-report.result == 'success' ||
      needs.collect-and-report.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main

      - name: 生成した成果物を取得
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: weekly-news-output
          path: output/

      - name: 検証済みのレポートをGitにコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add 'output/*.md'
          if [ -f output/viewer-json-ready.txt ]; then
            git add output/data/
          else
            echo "JSON一式の検証マーカーがないため、既存JSONを保持します。"
          fi
          rm -f output/viewer-json-ready.txt

          git diff --staged --quiet || git commit -m "[自動] 金融機関新着情報レポート $(TZ='Asia/Tokyo' date '+%Y-%m-%d')"

          # 金利履歴の取り込み（import-rate-history）の自動pushと同じ時間帯に走るため、
          # 競合したらリモートを取り込み直して再pushする（最大3回）。
          # commit 済みの状態で rebase するため成果物は巻き戻らない。
          # マーカーなしで output/data/ が未ステージのまま残る場合に備え autostash を使う。
          for attempt in 1 2 3; do
            if git push origin main; then
              exit 0
            fi
            echo "push失敗（${attempt}回目）。リモートの変更を取り込んで再試行します。"
            git pull --rebase --autostash origin main || exit 1
          done
          echo "pushの再試行がすべて失敗しました。"
          exit 1
