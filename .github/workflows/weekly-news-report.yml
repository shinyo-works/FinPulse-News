name: 週次金融機関新着情報レポート

on:
  schedule:
    - cron: '0 20 * * 0'  # 毎週日曜 20:00 UTC = 月曜 05:00 JST
  workflow_dispatch:       # 手動実行ボタン

concurrency:
  group: weekly-news-report-main
  cancel-in-progress: false

jobs:
  collect-and-report:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main

      - name: Python環境セットアップ
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: 固定した依存パッケージをインストール
        run: python -m pip install --require-hashes -r requirements.lock

      - name: 自動テスト
        run: python -m unittest discover -s tests -v

      - name: 収集・レポート生成・送信
        id: collect
        continue-on-error: true
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
        run: python scripts/collect_and_send.py

      - name: 生成した成果物を一時保存
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: weekly-news-output
          path: output/
          if-no-files-found: error
          retention-days: 1

      - name: 収集結果をActionsの成否に反映
        if: always() && steps.collect.outcome == 'failure'
        run: |
          echo "一部の金融機関の収集、JSON生成、またはメール送信に失敗しました。"
          exit 1

  publish-results:
    needs: collect-and-report
    if: >-
      always() &&
      (needs.collect-and-report.result == 'success' ||
      needs.collect-and-report.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main

      - name: 生成した成果物を取得
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: weekly-news-output
          path: output/

      - name: 検証済みのレポートをGitにコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add 'output/*.md'
          if [ -f output/viewer-json-ready.txt ]; then
            git add output/data/
          else
            echo "JSON一式の検証マーカーがないため、既存JSONを保持します。"
          fi
          rm -f output/viewer-json-ready.txt

          git diff --staged --quiet || git commit -m "[自動] 金融機関新着情報レポート $(TZ='Asia/Tokyo' date '+%Y-%m-%d')"
          git push origin main
